<html lang="zh-Hant">

<script src="shop-contact.js?v=20261126editor4"></script>

<link rel="apple-touch-icon" sizes="180x180" href="./assets/jun-orange-smile-180-v3.png">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--top-bg:#FFFFFF;--card:#FFFFFF;--text:#111827;--muted:#4B5563;--line:#E5E7EB;--accent:#0E7A4F;--accent-ink:#FFFFFF;--soft:#DCF5E8;--soft-ink:#075C3A;--err:#B91C1C;--radius:20px;--radius-sm:14px;--radius-btn:999px;--font:'Noto Sans TC',sans-serif;--bad-bg:#FEE2E2;--bad-ink:#7F1D1D;--ok-bg:#DCFCE7;--ok-ink:#14532D;--dis-bg:#E5E7EB;--dis-ink:#374151;--warn-bg:#FEF3C7;--warn-ink:#78350F}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,dl,dd{margin:0;padding:0}
ul{list-style:none}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.demo{background:var(--warn-bg);color:var(--warn-ink);font-size:13px;line-height:1.5;text-align:center;padding:4px 12px;border-bottom:1px solid #F3D88A}
.top{background:var(--top-bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brandlink{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);border-radius:50%}
.brand{font-weight:900;font-size:20px}
.nav{margin-left:auto;display:flex;gap:8px}
.page,.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px}
.page>section{margin-bottom:28px}
.page h1.ph{font-size:26px;font-weight:900;line-height:1.35;margin-bottom:4px}
.page h2.sh{font-size:20px;font-weight:900;margin:0 4px 12px}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 10px rgba(17,24,39,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 20px;border-radius:var(--radius-btn);border:1px solid var(--muted);background:var(--card);color:var(--text);font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;line-height:1.3}
.btn.sm{min-height:38px;padding:4px 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.dangerfill{background:var(--err);color:#fff;border-color:var(--err)}
.btn[disabled]{background:var(--dis-bg);color:var(--dis-ink);border-color:var(--dis-bg);cursor:not-allowed}
.hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:22px}
.hero h1{font-size:30px;font-weight:900;line-height:1.3}
.hero p{margin-top:2px}
.hero .btn.primary{background:#fff;color:var(--soft-ink);border-color:#fff}
.hero .btn{border-color:#fff;background:transparent;color:#fff}
.hero .btn.primary{background:#fff;color:var(--soft-ink)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.gcard{display:flex;flex-direction:column;gap:10px}
.gcard h3{font-size:18px;font-weight:900;line-height:1.4;overflow-wrap:anywhere}
.gcard.ended{background:#EEF0F3}
.gcard .actions,.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px}
.meta li{display:inline-flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.meta svg,.info svg{flex:none}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .btn{margin-top:12px}
.tagline{font-size:14px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:0 10px;min-height:24px;border-radius:999px;font-size:13px;font-weight:700;background:var(--soft);color:var(--soft-ink)}
.badge.off{background:var(--dis-bg);color:var(--dis-ink)}
.form{display:grid;gap:16px}
.fld{display:grid;gap:6px}
.fld>label,.fld>.lbl{font-weight:700}
.fld .hint{font-size:14px;color:var(--muted)}
.fld input,.fld select,.fld textarea,.share-row input{width:100%;min-height:46px;padding:8px 16px;background:var(--card);border:1px solid var(--muted);border-radius:var(--radius-sm);font-size:16px}
.fld textarea{min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.7;resize:vertical}
.fld textarea.has-err{border-color:var(--err);border-width:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--err);font-size:14px;font-weight:700}
.errlist{display:grid;gap:6px}
.errlist li{background:var(--bad-bg);color:var(--bad-ink);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.errlist li b{display:block}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.pv h3{font-size:16px;font-weight:900;margin:10px 0 4px}
.pv li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:15px}
.pv li:first-child{border-top:0}
.pv .vs{color:var(--muted)}
.map{width:100%;height:200px;border:0;display:block;border-radius:var(--radius-sm);background:var(--line)}
.maplink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:600;font-size:15px;min-height:40px}
.info{display:grid;gap:6px;margin:8px 0 12px;font-size:15px}
.info li{display:flex;gap:8px;align-items:flex-start;overflow-wrap:anywhere}
.info svg{margin-top:4px}
.share-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.share-row input{flex:1;min-width:200px;min-height:44px;border:1px solid var(--muted);border-radius:var(--radius-btn);padding:8px 16px}
.share h2,.pad h2{font-size:18px;font-weight:900;margin-bottom:4px}
.tabsx{display:flex;gap:8px;margin:0 0 16px;overflow-x:auto;padding:2px}
.tabsx button{flex:none;min-height:42px;padding:6px 20px;border:0;border-radius:var(--radius-btn);background:var(--card);box-shadow:0 1px 4px rgba(17,24,39,.1);font-weight:700;cursor:pointer}
.tabsx button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.num{background:var(--card);border-radius:var(--radius-sm);padding:12px;box-shadow:0 1px 6px rgba(17,24,39,.06);text-align:center}
.num span{display:block;font-size:14px;color:var(--muted)}
.num b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.num.bad b{color:var(--bad-ink)}.num.ok b{color:var(--ok-ink)}
.person{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(17,24,39,.06)}
.p-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.p-name{min-height:40px;padding:4px 16px;border-radius:var(--radius-btn);border:1px solid var(--muted);background:var(--card);font-weight:900;font-size:17px;cursor:pointer;overflow-wrap:anywhere;text-align:left}
.p-sum{font-weight:900;font-variant-numeric:tabular-nums}
.p-state{font-size:14px;color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:8px}
.cell{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px;border-radius:var(--radius-sm);border:2px solid;cursor:pointer;text-align:left;font-size:15px;font-weight:600;max-width:100%}
.cell .t{overflow-wrap:anywhere}
.cell .lb{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:900;padding:1px 8px;border-radius:999px;background:#fff}
.cell.unpaid{background:var(--bad-bg);color:var(--bad-ink);border-color:#B91C1C}
.cell.unpaid .lb{color:var(--bad-ink)}
.cell.paid{background:var(--ok-bg);color:var(--ok-ink);border-color:#15803D}
.cell.paid .lb{color:var(--ok-ink)}
.sumcat h3{font-size:18px;font-weight:900;margin:14px 0 4px}
.sumcat li{padding:6px 0;border-top:1px solid var(--line)}
.sumcat li:first-child{border-top:0}
.sumline{font-weight:700}
.sumnote{padding-left:20px;font-size:14px;color:var(--muted)}
.sumtotal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 0 4px;margin-top:10px;border-top:2px solid var(--text);font-weight:900;font-size:18px}
.copyfallback{width:100%;min-height:160px;margin-top:10px;padding:10px;border:1px solid var(--muted);border-radius:var(--radius-sm);font-size:14px}
.setrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{font-weight:700}
.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
/* order page (style C) */
.wrap{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"group" "shop" "mine" "menu" "all";gap:16px;padding-bottom:110px}
.group{grid-area:group;min-width:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:20px}
.group.ended{background:#374151}
.side{display:contents}.shop{grid-area:shop;min-width:0}.menu{grid-area:menu;min-width:0}.mine{grid-area:mine;min-width:0}.all{grid-area:all;min-width:0}
.eyebrow{font-size:14px;margin-bottom:4px;font-weight:500}
.group h1{font-size:24px;line-height:1.35;overflow-wrap:anywhere;font-weight:900}
.group .meta{margin-top:12px}
.shop h2,.cart h2,.mine h2,.all summary{font-size:18px;font-weight:900;margin-bottom:10px}
.shop,.cart-card,.mine,.all{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 10px rgba(17,24,39,.06)}
.shop .sname{font-weight:700;font-size:17px}
.all summary{cursor:pointer;margin:0;list-style:none;display:flex;justify-content:space-between;align-items:center}
.all summary::-webkit-details-marker{display:none}
.all[open] summary{margin-bottom:10px}
.all .chev{transition:transform .2s}.all[open] .chev{transform:rotate(180deg)}
.olist{display:grid;gap:10px}
.ob{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px}
.ob .oh{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.ob ul{margin-top:4px;font-size:15px}
.ob li{display:flex;justify-content:space-between;gap:10px}
.ob .lnote{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ob .actions{margin-top:8px}
.tabs{position:sticky;top:0;z-index:10;display:flex;gap:8px;padding:10px 0;background:var(--bg);overflow-x:auto}
.tab{flex:none;min-height:40px;padding:6px 18px;cursor:pointer;background:var(--card);border:0;box-shadow:0 1px 4px rgba(17,24,39,.1);border-radius:var(--radius-btn);color:var(--text);font-weight:700}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.cat{scroll-margin-top:64px;margin-bottom:20px}
.cat h2{font-size:22px;font-weight:900;margin:6px 4px 10px}
.cat h2 small{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:var(--radius);padding:12px 16px;box-shadow:0 1px 6px rgba(17,24,39,.06)}
.row{display:flex;align-items:center;gap:12px;min-height:44px}
.iname{flex:1;min-width:0;font-weight:700;font-size:17px;overflow-wrap:anywhere}
.vrow .vlabel{flex:1;min-width:0;padding-left:12px}
.price{font-variant-numeric:tabular-nums;font-size:20px;font-weight:900;color:var(--accent);white-space:nowrap}
.vrow .price{font-size:18px}
.qty{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;width:124px;flex:none}
.q-btn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;background:var(--card);border:1px solid var(--muted);border-radius:var(--radius-btn)}
.q-btn.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q-btn[disabled]{background:var(--dis-bg);color:var(--dis-ink);border-color:var(--dis-bg);cursor:not-allowed}
.q-n{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty.zero .minus,.qty.zero .q-n{display:none}
.notebtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:4px 0;min-height:32px;cursor:pointer;color:var(--accent);font-size:14px;text-decoration:underline}
.notebtn[disabled]{color:var(--dis-ink);cursor:not-allowed}
.note input{width:100%;min-height:42px;padding:8px 18px;margin:2px 0 6px;background:var(--card);border:1px solid var(--muted);border-radius:999px;font-size:16px}
.note input[disabled]{background:var(--dis-bg);color:var(--dis-ink)}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;max-height:85vh;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.1)}
.cart-body{display:none;overflow:auto;padding:16px}
.cart.open .cart-body{display:block}
.cart-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:10px 16px;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:900;border-radius:var(--radius) var(--radius) 0 0}
.cart-bar .chev{transition:transform .2s}.cart.open .chev{transform:rotate(180deg)}
.lines{display:grid;gap:8px;max-height:30vh;overflow:auto;margin-bottom:12px;font-size:15px}
.lines li{display:flex;justify-content:space-between;gap:10px}
.lines .lnote{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lines .emp{color:var(--muted)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);margin-bottom:10px}
.sum b{font-variant-numeric:tabular-nums;font-size:26px;font-weight:900}
.sum span b{font-size:inherit}
.field{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.field label{font-weight:600;flex:none}
.field input{flex:1;min-width:120px;min-height:44px;padding:8px 18px;background:var(--card);border:1px solid var(--muted);border-radius:999px;font-size:16px}
.field input[disabled]{background:var(--dis-bg);color:var(--dis-ink)}
.field .err{flex-basis:100%}
.submit{width:100%;min-height:52px;border:0;cursor:pointer;font-weight:900;font-size:17px;background:var(--accent);color:var(--accent-ink);border-radius:var(--radius-btn)}
.submit[disabled]{background:var(--dis-bg);color:var(--dis-ink);cursor:not-allowed}
.editing{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.closedmsg{background:var(--dis-bg);color:var(--dis-ink);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:10px;font-weight:700;font-size:15px}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 24px);padding:12px 18px;background:var(--soft);color:var(--soft-ink);border:1px solid var(--soft-ink);border-radius:var(--radius-sm);font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#toast.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-ink)}
.modal-ov{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:var(--radius);padding:22px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h2{font-size:20px;font-weight:900;margin-bottom:6px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal input{width:100%;min-height:46px;padding:8px 16px;border:1px solid var(--muted);border-radius:var(--radius-sm);margin-top:10px;font-size:16px}
.gate{max-width:420px;margin:24px auto}
@media(min-width:900px){
.wrap{grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"group side" "mine side" "menu side" "all side";column-gap:36px;padding-bottom:48px}
.side{display:block;grid-area:side;position:sticky;top:16px;align-self:start}
.shop{margin-bottom:16px}
.map{height:220px}
.group h1{font-size:30px}
.cart{position:static;max-height:none;box-shadow:0 2px 10px rgba(17,24,39,.06);border-radius:var(--radius)}
.cart-bar{display:none}
.cart-body{display:block;overflow:visible;padding:0}
.cart-pad{padding:18px}
.lines{max-height:26vh}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media(max-width:899px){.cart-pad{padding:0}}
@media(max-width:480px){.nums{gap:6px}.num b{font-size:19px}.hero h1{font-size:26px}}
/* v2: options, picker, promos, admin */
.promos{grid-area:promo;display:grid;gap:8px;min-width:0}
.promo{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:0 1px 6px rgba(17,24,39,.06);overflow-wrap:anywhere}
.promo .badge{flex:none;background:var(--soft-ink);color:#fff;margin-top:1px}
.itemhit{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;min-height:44px}
.itemhit:disabled{cursor:not-allowed}
.itemhit .iname{display:inline;flex:none}
.item .gnames{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.soldtag{display:none;margin-left:6px;vertical-align:middle}
.item.off{background:#EEF0F3;box-shadow:none}
.item.off .soldtag{display:inline-flex}
.item.off .iname,.item.off .price{color:var(--dis-ink)}
.pk-ov{position:fixed;inset:0;z-index:55;background:rgba(17,24,39,.55);display:flex;align-items:flex-end;justify-content:center}
.pk{background:var(--card);width:100%;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:pkup .2s ease-out}
@keyframes pkup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.pk-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 6px}
.pk-h h2{font-size:20px;font-weight:900;line-height:1.35;overflow-wrap:anywhere}
.pk-x{flex:none;width:44px;height:44px;border-radius:999px;border:1px solid var(--muted);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pk-b{overflow:auto;padding:0 16px 12px;flex:1 1 auto;min-height:0}
.pk-f{display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none}
.pg{margin:14px 0 0}
.pg-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900;margin-bottom:6px}

      if(e.key==='Escape')done(false);

        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}

    }
    document.addEventListener('keydown',key);
    ov.addEventListener('click',function(e){var b=e.target.closest('button[data-r]');if(b)done(b.getAttribute('data-r')==='1');});

  return {
    on:function(p,cb,opt){if(opt&&(opt.orderBy||opt.startAt!=null||opt.limit)){var original=cb;cb=function(v){var ks=Object.keys(v||{}).sort(function(a,b){return Number((v[a]||{})[opt.orderBy||'createdAt']||0)-Number((v[b]||{})[opt.orderBy||'createdAt']||0);});if(opt.startAt!=null)ks=ks.filter(function(k){return Number((v[k]||{})[opt.orderBy||'createdAt']||0)>=opt.startAt;});if(opt.limit)ks=ks.slice(-opt.limit);var out={};ks.forEach(function(k){out[k]=v[k];});original(out);};}var l={p:p,cb:cb,first:true,last:null};ls.push(l);var v=getAt(p);l.first=false;l.last=JSON.stringify(v);cb(v==null?null:cleanJSON(v));return function(){var i=ls.indexOf(l);if(i>=0)ls.splice(i,1);};},

    update:function(p,o){try{data=load();Object.keys(o).forEach(function(k){needVal(o[k],p+'/'+k);setAt(p+'/'+k,o[k]);});persist();notify();return Promise.resolve();}catch(e){return Promise.reject(e);}},
    writeGroupAccess:function(patch){try{
      data=load();
      function transferIndexRemoval(k){var m=/^userOrders\/([A-Za-z0-9_-]+)\/([A-Za-z0-9_-]+)\/([A-Za-z0-9_-]+)$/.exec(k);if(!m||!adminUser())return false;var base='orders/'+m[2]+'/'+m[3],audit=patch[base+'/lastTransfer'];return !!(audit&&audit.fromUid===m[1]&&audit.byUid===userId()&&getAt(base+'/userId')===m[1]&&patch[base+'/userId']===audit.toUid&&patch['userOrders/'+audit.toUid+'/'+m[2]+'/'+m[3]]);}
      Object.keys(patch).forEach(function(k){if(patch[k]===null&&!groupIndexPath(k)&&!transferIndexRemoval(k))throw new Error('不可清除團購資料');});

    removePaths:function(ps){try{ps.forEach(function(p){if(!okDelPath(p))throw new Error('不可刪除這個位置（'+p+'）');});data=load();ps.forEach(delAt);persist();notify();return Promise.resolve();}catch(e){return Promise.reject(e);}}
  };
})();

var FbDB=(function(){

  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('資料服務載入失敗'));};document.head.appendChild(s);});}

    set:function(p,v){try{needVal(v,p);}catch(e){return Promise.reject(e);}return init().then(function(db){return db.ref(p).set(cleanJSON(v));});},

  };

function deleteGroupData(gid){

  return DB.get('groups/'+gid).then(function(g){

      Object.keys(os||{}).forEach(function(oid){var u=os[oid]&&os[oid].userId;if(typeof u==='string'&&/^[^\/.#$\[\]]+$/.test(u)&&!seen[u]){seen[u]=1;ps.push('userOrders/'+u+'/'+gid);}});

function parseGroup(s){
  s=s.replace(/：/g,':').replace(/＊/g,'*').replace(/＋/g,'+');

  if(Object.prototype.hasOwnProperty.call(so,ik))return so[ik]===true;
  var p=String(ik).split('-'),c=menu[p[0]],it=c&&c.items[p[1]];
  return !!(it&&it.so);
}
// 2026-11-23 團主「用店家最新菜單更新這團」：menuSig 比較兩份菜單是否相同；remapSoldOut 把停售開關照品名對到新菜單
// （停售是用「分類序-品項序」記的，換菜單後序號會變；分類改名時只用品名對，且新菜單裡同名只有一項才對）
function menuSig(cats){return JSON.stringify(menuOf({menu:cats}));}
function remapSoldOut(group,nextCats){
  var oldMenu=menuOf(group&&group.shop),so=(group&&group.soldOut)||{},full={},byName={},out={},has=Object.prototype.hasOwnProperty,next=menuOf({menu:nextCats}),count={};
  Object.keys(so).forEach(function(k){
    var p=String(k).split('-'),c=oldMenu[p[0]],it=c&&c.items[p[1]],v=so[k]===true;if(!it)return;
    full[c.c+'\u0001'+it.n]=v;
    byName[it.n]=has.call(byName,it.n)&&byName[it.n]!==v?null:v;
  });
  next.forEach(function(c){c.items.forEach(function(it){count[it.n]=(count[it.n]||0)+1;});});
  next.forEach(function(c,ci){c.items.forEach(function(it,ii){
    var k=c.c+'\u0001'+it.n,v=has.call(full,k)?full[k]:(count[it.n]===1&&(byName[it.n]===true||byName[it.n]===false)?byName[it.n]:undefined);
    if(v!==undefined)out[ci+'-'+ii]=v;
  });});
  return out;
}

  a=impKey(a);b=impKey(b);if(!a||!b)return 0;if(a===b)return 1;
  var sh=Math.min(a.length,b.length),lo=Math.max(a.length,b.length);
  // 一邊包含另一邊：「二十三號小吃店」在「二十三號小吃店（二三小吃）」裡 → 高分；只有品牌名「水巷茶弄」→ 分數較低

    return relayGet({op:'menu-search',q:term}).then(function(j){
      if(j.error){r.warnings.push('其他菜單來源暫時無法搜尋，請稍後重試或直接貼菜單連結');return r;}
      r.warnings=r.warnings.concat(arr(j.warnings));var seen={};
      arr(j.list).forEach(function(c){var url=impSafeUrl(c.url||c.id);if(!url||seen[url])return;seen[url]=1;c.url=url;c.id=url;c.src=IMP_SRC[c.src]?c.src:impSourceOf(url);c.dist=null;c.best=false;r.list.push(c);});return r;
    },function(){r.warnings.push('其他菜單來源暫時無法搜尋，請直接貼店家的菜單連結');return r;});
  });
}
function impWire(root,h){ // h={sm,sa,pv,mp,isDefaultMenu}
  var iq=root.querySelector('#iq'),ib=root.querySelector('#ib'),ir=root.querySelector('#ir'),seq=0,last=[],filled={};
  function live(my){return my===seq&&ir.isConnected;} // 換了頁或又按了一次 → 舊的結果不要再寫回畫面
  function msg(html,bad){ir.innerHTML='<p class="imp-msg'+(bad?' bad':'')+'">'+html+'</p>';}
  function listHtml(r){
    var L=r.where||{},place=L.how==='place-part'&&L.place?String(L.place):'';
    var warningList=arr(r.warnings).filter(function(w){return !/無法直接讀取品項與價格/.test(w);});var warnings=warningList.length?'<p class="imp-warnings">'+warningList.map(esc).join('；')+'</p>':'';
    var searches='';
    if(!r.list.length)return '<p class="imp-msg">目前沒有找到可確認的菜單，這不代表店家沒有營業。可改貼店家的官網、iCHEF、快一點或 Oddle 菜單連結。</p>'+warnings+searches;
    return '<p class="imp-msg">'+(place?'在「'+esc(place)+'」附近找到 ':'找到 ')+r.list.length+' 筆店家／菜單來源，請確認店名與分店：</p>'+warnings+'<ul class="imp-list">'+r.list.map(function(c,i){
      var dt=impDistText(c.dist),sub=esc(c.address||'')+(dt?(c.address?'・':'')+'<span class="imp-d">'+dt+'</span>':'');
      var url=impSafeUrl(c.url),external=c.src!=='dbd'&&c.src!=='nidin',label=external?'讀取菜單':'帶入';
      return '<li><div class="imp-m"><p class="imp-n"><span>'+esc(c.name)+'</span><span class="imp-src">'+esc(IMP_SRC[c.src]||'店家網站')+'</span>'+(c.best?'<span class="imp-best">最符合</span>':'')+'</p>'+(sub?'<p class="imp-a">'+sub+'</p>':'')+(external?'<p class="imp-a">'+esc(url?new URL(url).hostname:'')+'・請核對店家與價格</p>':'')+'</div><div class="imp-source-actions">'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">開啟來源 ↗</a>':'')+'<button type="button" class="btn sm" data-i="'+i+'" aria-label="'+label+' '+esc(c.name)+'（'+esc(IMP_SRC[c.src]||'店家網站')+'）">'+label+'</button></div></li>';
    }).join('')+'</ul>'+searches+'<div id="imp-detail" aria-live="polite"></div>';
  }
  function prepareFacts(s,c){
      // 欄位是空的、或內容還是上一次帶入的 → 換成這家的；使用者自己打過的（含編輯頁原本存好的）不動
      var F=[['#sn','店名',s.name||(c.name==='店家菜單'?'':c.name)],['#sa','地址',s.address],['#sp','電話',s.phone],['#sh','營業時間',s.hours]].filter(function(f){return root.querySelector(f[0]);});
      F.forEach(function(f){var el=root.querySelector(f[0]);f[2]=String(f[2]||'').slice(0,+el.getAttribute('maxlength')||200);f[3]=el.value.trim();f[4]=!f[3]||f[3]===filled[f[0]];});
      function fill(f){if(f[4]&&f[2].trim()){var field=root.querySelector(f[0]);field.value=f[2];filled[f[0]]=field.value.trim();field.dispatchEvent(new Event('input',{bubbles:true}));field.dispatchEvent(new Event('change',{bubbles:true}));}}
      var chg=F.filter(function(f){return f[4]&&f[3]!==f[2].trim();}).map(function(f){return f[1];}),
          keep=F.filter(function(f){return !f[4]&&f[3]!==f[2].trim();}).map(function(f){return f[1];});
      return {apply:function(){F.forEach(fill);h.mp();},chg:chg,keep:keep};

  }
  function busy(on){ib.disabled=on;Array.prototype.forEach.call(ir.querySelectorAll('button'),function(b){b.disabled=on||b.getAttribute('data-unsafe-url')==='true';});}
  function find(){
    var q=iq.value.trim(),my=++seq;
    if(!q){busy(false);msg('請先貼上地圖、菜單連結、地址或店名',true);iq.focus();return;}
    busy(true);msg('正在查詢店家與多個菜單來源，請稍候…');
    impFind(q).then(function(r){if(!live(my))return;last=r.list;ir.innerHTML=listHtml(r);if(last.length===1&&last[0].shop)prepareFacts(last[0].shop,last[0]).apply();busy(false);},
      function(e){if(!live(my))return;busy(false);msg(esc(e&&e.imp?e.message:'找店時出了問題，請稍後再試'),true);});
  }
  ib.addEventListener('click',find);
  iq.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();find();}}); // 不要觸發「儲存店家」
  ir.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button[data-i]');if(!b)return;
    var c=last[+b.getAttribute('data-i')];if(!c)return;
    var my=++seq;busy(true);b.textContent='讀取中…';
    impLoad(c).then(function(s){
      if(!live(my))return;
      var text=menuTextFrom(s.cats),r=parseMenu(text);
      var facts=prepareFacts(s,c),fillMetadata=facts.apply,chg=facts.chg,keep=facts.keep;
      if(!r.count){
        fillMetadata();
        if(c.src==='dbd'||c.src==='nidin'){busy(false);b.textContent='帶入';var emptyDetail=ir.querySelector('#imp-detail');if(emptyDetail)emptyDetail.innerHTML='<p class="imp-note">這家店在'+esc(IMP_SRC[c.src])+'目前沒有可帶入的品項，請改貼其他菜單連結；尚未更動目前菜單。</p>';return;}
        var detail=ir.querySelector('#imp-detail'),links=[{url:s.url||c.url,name:'開啟店家菜單'}].concat(arr(s.links),arr(s.images).map(function(im){return {url:im.url,name:im.name||'開啟菜單圖片'};})),seen={};
        var html='<p class="imp-note">已帶入查得到的店家資料，但尚未讀到菜單。可改貼其他來源或上傳照片。</p><div class="imp-links">'+links.map(function(l){var u=impSafeUrl(l.url);if(!u||seen[u])return '';seen[u]=1;return '<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(l.name||'開啟菜單')+' ↗</a>';}).join('')+'</div>';
        busy(false);b.textContent='讀取菜單';if(detail)detail.innerHTML=html;else msg(html);return;
      }
      function apply(){
        if(!live(my))return;
        fillMetadata();
        h.sm.value=keepSharedLines(h.sm.value,text);h.sm.dispatchEvent(new Event('input',{bubbles:true}));
        busy(false);b.textContent='帶入';
        var sourceUrl=impSafeUrl(s.url||c.url);
        msg('已帶入「'+esc(s.name||c.name)+'」'+r.cats.length+' 個分類、'+r.count+' 個品項（來源 '+IMP_SRC[c.src]+'）。'+(r.errors.length?'有 '+r.errors.length+' 行要手動修正（菜單框紅字）。':'')+(arr(s.warnings).length?'<br>提醒：'+arr(s.warnings).map(esc).join('；')+'<br>':'')+'請看預覽，沒問題再按「儲存店家」。'+(sourceUrl?'<br><a href="'+esc(sourceUrl)+'" target="_blank" rel="noopener noreferrer">核對原始菜單 ↗</a>':''));
        toast('已帶入 '+r.count+' 個品項，記得按「儲存店家」');
      }
      if(h.isDefaultMenu(h.sm.value))return apply();
      return ask({title:'取代目前的菜單？',body:'菜單框會換成「'+(s.name||c.name)+'」的 '+r.count+' 個品項'+(chg.length?'，'+chg.join('、')+'也會換成這家的':'')+(keep.length?'；'+keep.join('、')+'維持原本的，不會被改':'')+'。按「儲存店家」之前都不會存。',okText:'取代'}).then(function(ok){
        if(!live(my))return;
        if(ok)apply();else{busy(false);b.textContent='帶入';}
      });
    }).catch(function(e){if(!live(my))return;busy(false);var external=c.src!=='dbd'&&c.src!=='nidin';b.textContent=external?'讀取菜單':'帶入';if(e&&e.unsafeUrl){Array.prototype.forEach.call(ir.querySelectorAll('a'),function(a){if(a.getAttribute('href')===c.url)a.removeAttribute('href');});c.url='';c.id='';b.setAttribute('data-unsafe-url','true');b.disabled=true;b.textContent='無法使用';}var detail=ir.querySelector('#imp-detail'),message=esc(e&&e.imp?e.message:'讀取菜單時出了問題，請稍後再試');if(detail)detail.innerHTML='<p class="imp-msg bad">'+message+'</p>';else msg(message,true);});
  });
}

  return function(){clearTimeout(timer);};
}

function pageNew(root,q){
  var shops={},titleTouched=false,built=false,audiencePicker=null,syncShopOptions=null,alive=true,busy=false,C=window.LunchShopContact;
  root.innerHTML='<div class="page"><p class="muted">載入中…</p></div>';
  function defTitle(shopName){return '週'+WD[taipeiClock(now()).getUTCDay()]+'午餐｜'+(shopName||'');}
  function currentShopIds(){
    return Object.keys(shops).filter(function(k){return shops[k]&&!shops[k].deleted;}).sort(function(a,b){return (shops[b].updatedAt||0)-(shops[a].updatedAt||0);});
  }
  function deadlineValue(){
    var date=root.querySelector('#gd'),time=root.querySelector('#gm');
    return date&&time?parseDT(date.value,time.value):NaN;
  }
  function deadlineState(shop, timestamp){
    return C.stateOf(shop,timestamp===undefined?deadlineValue():timestamp);
  }
  function availabilityMessage(shop,timestamp){
    if(!shop||shop.deleted)return '請選擇一間正常供應的店家。';
    return deadlineState(shop,timestamp)==='resting'?'店家在截止時間休息，請調整截止日期／時間，或選其他店家。':'截止時間的營業狀況待確認，開團前請先向店家確認。';
  }
  function shopOptions(ids,sel,timestamp){
    return ids.map(function(k){
      var s=shops[k],state=deadlineState(s,timestamp),orderable=C.isOrderable(s,timestamp);
      return '<option value="'+esc(k,true)+'"'+(k===sel?' selected':'')+(orderable?'':' disabled')+'>'+esc(s.name)+(orderable?'':'（'+(state==='resting'?'截止時間休息':C.states[state])+'）')+'</option>';
    }).join('');
  }
  function build(){
    var ids=currentShopIds();
    if(!ids.length){root.innerHTML='<div class="page">'+emptyBox('還沒有店家，請先新增一家。','<br><a class="btn primary" href="#/shops/new">新增店家</a>')+'</div>';return;}
    built=true;
    var dl=parseDT(dateVal(now()),'11:00');
    if(dl<=now())dl=now()+3600000;
    var sel=ids.includes(q.shop)?q.shop:ids.find(function(k){return C.isOrderable(shops[k],dl);})||ids[0];
    root.innerHTML='<div class="page"><section><a class="backlink" href="#/">'+I('back',15)+'回首頁</a><h1 class="ph">開新團</h1></section><section class="card"><form class="form" id="f" novalidate>'+
    '<div class="fld"><label for="gs">店家</label><select id="gs" aria-describedby="gsStatus">'+shopOptions(ids,sel,dl)+'</select><p class="shop-availability-warning" id="gsStatus" role="status" hidden></p></div>'+
    '<div class="fld"><label for="gt">團名</label><input id="gt" maxlength="40" autocomplete="off"></div>'+
    '<div class="fld"><label for="go">負責人（必填）</label><input id="go" maxlength="20" autocomplete="off" placeholder="你的名字" value="'+esc(LS.get(K.owner,''))+'"><p class="err" id="goE" role="alert" hidden>請輸入負責人名字</p></div>'+
    '<div class="row2"><div class="fld"><label for="gd">截止日期</label><input id="gd" type="date" value="'+dateVal(dl)+'"></div><div class="fld"><label for="gm">截止時間</label><input id="gm" type="time" value="'+fmtTime(dl)+'"></div></div>'+
    freeShippingField('gfs',shops[sel].freeShippingThreshold)+
    '<div id="newAudience"></div>'+
    '<p class="err" id="fE" role="alert" hidden></p><div class="actions"><button type="submit" class="btn primary">建立並取得分享連結</button></div></form></section></div>';
    audiencePicker=window.LunchParticipants.picker(root.querySelector('#newAudience'),{});
    var gs=root.querySelector('#gs'),gt=root.querySelector('#gt'),gsStatus=root.querySelector('#gsStatus');
    var form=root.querySelector('#f'),submit=form.querySelector('[type=submit]');
    function syncTitle(){if(!titleTouched)gt.value=defTitle(shops[gs.value]&&shops[gs.value].name);}
    function syncShipping(){var threshold=parseFreeShippingThreshold(shops[gs.value]&&shops[gs.value].freeShippingThreshold);root.querySelector('#gfs').value=Number.isFinite(threshold)&&threshold>0?String(threshold):'';}
    function syncStatus(){
      var selected=shops[gs.value],timestamp=deadlineValue(),valid=Number.isFinite(timestamp),state=deadlineState(selected,timestamp);
      var available=valid&&C.isOrderable(selected,timestamp);
      gsStatus.hidden=available&&state!=='unknown';
      gsStatus.textContent=valid?availabilityMessage(selected,timestamp):'請選好截止日期與時間，以確認店家營業狀況。';
      submit.disabled=busy||!available;
    }
    syncTitle();syncShipping();syncStatus();
    gs.addEventListener('change',function(){syncTitle();syncShipping();syncStatus();});
    gt.addEventListener('input',function(){titleTouched=true;});
    syncShopOptions=function(){
      var old=gs.value,list=currentShopIds();
      gs.innerHTML=shopOptions(list,old,deadlineValue());
      if(!list.includes(old))gs.selectedIndex=-1;
      syncStatus();
    };
    ['#gd','#gm'].forEach(function(selector){
      ['input','change'].forEach(function(event){root.querySelector(selector).addEventListener(event,function(){syncShopOptions();});});
    });
    form.addEventListener('submit',function(e){
      e.preventDefault();
      if(busy)return;
      var fE=root.querySelector('#fE');fE.hidden=true;
      var selected=gs.value,sh=shops[selected];
      var owner=root.querySelector('#go').value.trim(),title=gt.value.trim()||defTitle(sh&&sh.name);
      var dls=parseDT(root.querySelector('#gd').value,root.querySelector('#gm').value);
      root.querySelector('#goE').hidden=!!owner;
      function er(m){fE.textContent=m;fE.hidden=false;}
      if(!owner){root.querySelector('#go').focus();return;}
      if(isNaN(dls)){er('請選好截止日期與時間');return;}
      if(dls<=now()){er('截止時間已經過了，請選之後的時間');return;}
      if(!C.isOrderable(sh,dls)){syncStatus();return;}

      var freeShippingThreshold=parseFreeShippingThreshold(root.querySelector('#gfs').value);
      if(!Number.isFinite(freeShippingThreshold)){er('免運門檻請填 0–1,000,000 的整數，或留白');root.querySelector('#gfs').focus();return;}
      var audience;try{audience=audiencePicker.value();}catch(error){er(error.message);return;}
      busy=true;gs.disabled=true;syncStatus();
      DB.get('shops/'+selected).then(function(latest){
        if(!alive)return;
        if(latest)shops[selected]=latest;else delete shops[selected];
        syncShopOptions();
        if(deadlineValue()!==dls){er('截止日期或時間已變更，請確認後重新送出。');return;}
        if(!C.isOrderable(latest,dls)){er(availabilityMessage(latest,dls));return;}
        if(dls<=now()){er('截止時間已經過了，請選之後的時間');return;}
        var menu=parseMenu(latest.menuText);
        if(!menu.count){er('這家店還沒有菜單，請先到店家頁補上品項');return;}
        var gid=DB.newId(),now2=now();
        var snapshot={name:latest.name,address:latest.address||'',phone:latest.phone||'',tags:latest.tags||'',hours:latest.hours||'',promos:latest.promos||'',menu:menu.cats,cuisine:C.cuisinesOf(latest)[0],cuisines:C.cuisinesOf(latest),otherCuisine:latest.otherCuisine||''};
        var shopThreshold=parseFreeShippingThreshold(latest.freeShippingThreshold);
        if(Number.isFinite(shopThreshold)&&shopThreshold>0)snapshot.freeShippingThreshold=shopThreshold;
        snapshot=Object.assign(snapshot,C.snapshot(latest),C.deliverySnapshot(latest));
        if(Number(latest.menuUpdatedAt)>0&&Number.isFinite(Number(latest.menuUpdatedAt)))snapshot.menuUpdatedAt=Number(latest.menuUpdatedAt);
        var g={shopId:selected,shop:snapshot,title:title,owner:owner,deadline:dls,closed:false,createdAt:now2};
        if(freeShippingThreshold)g.freeShippingThreshold=freeShippingThreshold;
        g.audience=audience.audience;g.participants=audience.participants;
        if(userId())g.ownerUserId=userId();
        return DB.updateGroupAccess(gid,null,g).then(function(){
          LS.set(K.owner,owner);addMyGroup(gid);
          if(alive){toast('團已建立');location.hash='#/g/'+gid+'/admin?new=1';}
        });
      }).catch(function(error){if(alive)er(error&&error.message?error.message:'建立團購未成功，請稍後重試。');}).finally(function(){busy=false;gs.disabled=false;if(alive)syncStatus();});
    });
  }
  var off=DB.on('shops',function(v){shops=v||{};if(!built)build();else syncShopOptions();});
  var timer=setInterval(function(){if(built&&!busy)syncShopOptions();},30000);
  function refreshAvailability(){if(built&&!busy)syncShopOptions();}
  document.addEventListener('visibilitychange',refreshAvailability);
  return function(){alive=false;off();clearInterval(timer);document.removeEventListener('visibilitychange',refreshAvailability);if(audiencePicker)audiencePicker.destroy();};
}

/* Update only the group's menu snapshot; submitted orders retain their original prices and choices. */
function syncGroupMenu(gid,baseline,active,hasCart){
  var shopId=baseline.shopId,signature=menuSig(baseline.shop&&baseline.shop.menu);
  if(!shopId)return Promise.reject(new Error('這個團沒有對應的店家，無法更新菜單'));
  return DB.get('shops/'+shopId).then(function(shop){
    if(!active())return false;
    if(!shop||shop.deleted)throw new Error('找不到這家店，可能已經被刪除');
    var next=parseMenu(shop.menuText);
    if(!next.count)throw new Error('店家菜單是空的，沒有更新');
    if(next.errors.length)throw new Error('店家菜單有格式錯誤，請先修正再更新');
    if(menuSig(next.cats)===signature){toast('這團已經是店家最新的菜單');return false;}
    return ask({title:'更新最新菜單？',body:'新菜單共 '+next.count+' 項。已送出的訂單與金額不變，停售設定會依品名保留。'+(hasCart?'目前尚未送出的購物車會清空。':''),okText:'更新菜單',cancelText:'先不要'}).then(function(ok){
      if(!ok||!active())return false;
      return Promise.all([DB.get('shops/'+shopId),DB.get('groups/'+gid)]).then(function(v){
        if(!active())return false;
        var latestShop=v[0],latestGroup=v[1];
        if(!latestShop||latestShop.deleted||latestShop.menuText!==shop.menuText)throw new Error('店家菜單剛剛又更新了，請重新確認後再試');
        if(!latestGroup||latestGroup.deleted||latestGroup.shopId!==shopId||(!adminUser()&&latestGroup.ownerUserId!==userId()))throw new Error('團購或管理權限已變更，請重新整理');
        if(menuSig(latestGroup.shop&&latestGroup.shop.menu)!==signature)throw new Error('團購菜單已由其他人更新，請重新整理後再確認');
        var so=remapSoldOut(latestGroup,next.cats),patch={};
        patch['groups/'+gid+'/shop/menu']=next.cats;
        if(Object.keys(so).length||latestGroup.soldOut)patch['groups/'+gid+'/soldOut']=Object.keys(so).length?so:false;
        if(Number(latestShop.menuUpdatedAt)>0)patch['groups/'+gid+'/shop/menuUpdatedAt']=Number(latestShop.menuUpdatedAt);
        return DB.update('',patch).then(function(){return DB.get('groups/'+gid);}).then(function(saved){if(!active())return false;if(!saved||saved.deleted)throw new Error('團購已不存在，請重新整理');return saved;});
      });
    });
  });
}

function pageGroup(root,gid){
  var group=null,orders={},got=false,built=false,lastClosed=null,editingId=null,submitting=false,retryOrderId=null,pageAlive=true;
  var minePaid={},minePaidOff={},paymentOrderId='';
  var menu=[],itemIdx={},cart=[],closePicker=null,closeSuccessDialog=null,menuEl,linesEl;

  function mounted(){return pageAlive&&built&&group&&!group.deleted&&root.isConnected!==false&&!!$('#submit');}
  function notFound(){root.innerHTML='<div class="page">'+emptyBox('找不到這個團，可能連結有誤或已經被刪除。','<br><a class="btn primary" href="#/">回首頁</a>')+'</div>';built=false;}
  function sold(ik){return itemIdx[ik]?isSoldOut(group,menu,ik):false;}

    var options=l.options.map(function(o){return [o.group,o.choice,o.add];});
    return JSON.stringify([l.ik,l.base,options,l.note||'']);
  }
  function unitOf(l){return l.base+l.options.reduce(function(s,x){return s+x.add;},0);}
  function addLine(l){var k=lineKey(l);for(var i=0;i<cart.length;i++){if(lineKey(cart[i])===k){cart[i].qty=Math.min(99,cart[i].qty+l.qty);return;}}cart.push(l);}

  function build(){
    built=true;menu=menuOf(group.shop);itemIdx={};cart=[];builtSig=menuSig(group.shop&&group.shop.menu);menuStale=false;
    var s=group.shop,html='',tabs='',C=window.LunchShopContact,shopPhone=C.phoneHtml(s.phone,esc,false);

      cat.items.forEach(function(it,ii){
        var ik=ci+'-'+ii;itemIdx[ik]={ci:ci,cat:cat.c,it:it};
        html+='<div class="item" data-ik="'+ik+'"><div class="row"><button type="button" class="itemhit" data-open="'+ik+'"><span class="iname">'+esc(it.n)+'</span><span class="item-count" hidden></span><span class="badge off soldtag">停售</span>'+(specialNote(it)?'<span class="gnames">'+esc(specialNote(it))+'</span>':'')+(it.d?'<span class="inote">'+esc(it.d)+'</span>':'')+'</button><span class="price">$'+it.p+'</span><button type="button" class="q-btn plus" data-add="'+ik+'" aria-label="加入 '+esc(it.n)+'">'+I('plus')+'</button></div></div>';
      });
      html+='</div></section>';
    });
    var promoLines=String(s.promos||'').split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
    root.innerHTML='<div class="wrap'+(promoLines.length?' hp':'')+'" id="wrap">'+
    '<section class="group" id="gCard"></section>'+
    (promoLines.length?'<section class="promos" aria-label="店家優惠活動">'+promoLines.map(function(t){return '<div class="promo"><span class="badge">活動</span><span>'+esc(t)+'</span></div>';}).join('')+'</section>':'')+
    '<section class="mine" id="mine" hidden><h2>你已送出的訂單</h2><div class="olist" id="mineL"></div></section>'+
    '<div class="side"><section class="shop"><h2>店家資訊</h2><p class="sname">'+I(C.cuisineOf(s.cuisine).icon,18)+esc(s.name)+'</p><ul class="info">'+(s.hours?'<li>'+I('clock')+'<span>營業時間 '+esc(s.hours)+'</span></li>':'')+(s.address?'<li>'+I('pin')+'<span>'+esc(s.address)+'</span></li>':'')+(shopPhone?'<li>'+I('phone')+shopPhone+'</li>':'')+'</ul>'+shopDeliveryHtml(s)+C.contactHtml(s,esc,{hideMap:true})+mapHtml(s.address,s.mapsUrl)+'</section>'+
    '<section class="cart" id="cart" aria-label="購物車"><div class="cart-body"><div class="cart-pad"><h2>你的訂單</h2><div class="editing" id="editing" hidden><span>正在修改「<b id="editWho"></b>」的訂單</span><button type="button" class="btn sm" id="editCancel">不改了</button></div><div class="closedmsg" id="closedMsg" hidden>這個團已截止，不能再點餐或修改。</div><ul class="lines" id="lines"></ul><div class="sum"><span>已點 <b id="n">0</b> 份　合計</span><b id="total">$0</b></div><div class="field"><label for="uname">你的名字</label><input id="uname" type="text" autocomplete="off" maxlength="20" placeholder="請輸入名字" aria-describedby="nameErr"><p class="err" id="nameErr" role="alert" hidden>請輸入你的名字</p></div><p class="err" id="cartErr" role="alert" hidden style="margin-bottom:10px">還沒有點任何餐點</p><button type="button" class="submit" id="submit">送出訂單</button></div></div><button type="button" class="cart-bar" id="bar" aria-expanded="false" aria-controls="cart"><span>已點 <b id="nBar">0</b> 份</span><span>合計 <b id="totBar">$0</b></span>'+I('chev',20).replace('<svg ','<svg class="chev" ')+'</button></section></div>'+
    '<section class="menu"><div class="menu-heading"><h2>菜單</h2><button type="button" class="btn sm" id="syncMenu"'+(canManageGroup()?'':' hidden')+'>更新最新菜單</button></div><nav class="tabs" id="tabs" aria-label="菜單分類">'+tabs+'</nav><div id="menu">'+html+'</div></section>'+

    $('#uname').value=currentUser?currentUser.name||currentUser.displayName||'':LS.get(K.name,'');if(currentUser){if(window.LunchTraditional)$('#uname').value=window.LunchTraditional($('#uname').value);$('#uname').readOnly=true;$('#uname').closest('.field').hidden=true;}
    wire();
  }
  function update(){
    var n=0,t=0,dis=menuBusy||groupClosed(group)||!mayJoinGroup(group);
    var h='';
    if(!cart.length)h='<li class="emp">還沒有點餐<span data-lunch-kaomoji="noOrder"></span></li>';
    cart.forEach(function(l,i){
      var sub=unitOf(l)*l.qty,st=sold(l.ik);n+=l.qty;t+=sub;
      var itemLabel=esc(lineLabel(l));
      h+='<li><div class="lt">'+itemLabel+' ×'+l.qty+(st?' <span class="stopped">（已停售）</span>':'')+(l.note?'<span class="lo">備註：'+esc(l.note)+'</span>':'')+'</div><div class="lsub">'+money(sub)+'</div><div class="lc"><button type="button" class="q-btn" data-cm="-" data-ci="'+i+'" aria-label="減少 '+itemLabel+'"'+(dis||l.qty<=1?' disabled':'')+'>'+I('minus')+'</button><span class="ln">'+l.qty+'</span><button type="button" class="q-btn plus" data-cm="+" data-ci="'+i+'" aria-label="增加 '+itemLabel+'"'+(dis?' disabled':'')+'>'+I('plus')+'</button>'+
        '<button type="button" class="btn sm ledit" data-cm="edit" data-ci="'+i+'" aria-haspopup="dialog" aria-label="修改 '+itemLabel+'"'+(dis||st||menuStale?' disabled':'')+'>修改</button><button type="button" class="btn sm ldel" data-cm="x" data-ci="'+i+'" aria-label="刪除 '+itemLabel+'"'+(dis?' disabled':'')+'>刪除</button></div></li>';
    });
    linesEl.innerHTML=h;
    $('#n').textContent=n;$('#nBar').textContent=n;$('#total').textContent=money(t);$('#totBar').textContent=money(t);
    var progress=$('#freeShippingProgress');if(progress)progress.innerHTML=freeShippingHtml(group,orders,false);
    Array.prototype.forEach.call(menuEl.querySelectorAll('.item'),function(el){var ik=el.getAttribute('data-ik'),qty=cart.filter(function(l){return l.ik===ik;}).reduce(function(sum,l){return sum+l.qty;},0);el.classList.toggle('picked',qty>0);var badge=el.querySelector('.item-count');if(badge){badge.hidden=!qty;badge.textContent='已選 '+qty;}});
    return n;
  }
  function paintMenu(){
    var closed=menuBusy||groupClosed(group)||!mayJoinGroup(group);
    Array.prototype.forEach.call(menuEl.querySelectorAll('.item'),function(el){
      var so=sold(el.getAttribute('data-ik'));
      el.classList.toggle('off',so);
      Array.prototype.forEach.call(el.querySelectorAll('button'),function(b){b.disabled=so||closed;});
    });
  }
  function resetCart(){cart=[];update();}
  function setEditing(o){
    editingId=o?o.id:null;$('#editing').hidden=!o;if(o)$('#editWho').textContent=o.name;
    $('#submit').textContent=o?'更新訂單':'送出訂單';
  }
  function findIk(cat,name){
    var exact=[],byName=[];
    for(var k in itemIdx){var ref=itemIdx[k];if(ref.it.n!==name)continue;byName.push(k);if(ref.cat===cat)exact.push(k);}
    var matches=exact.length?exact:byName;return matches.length===1?matches[0]:null;
  }
  function loadOrder(o){
    setEditing(o);$('#uname').value=currentUser?(currentUser.name||currentUser.displayName||o.name):o.name;if(window.LunchTraditional)$('#uname').value=window.LunchTraditional($('#uname').value);

  function itemsHtml(o){return '<ul>'+arr(o.items).map(function(it){return '<li><span>'+esc(lineLabel(it))+' ×'+it.qty+(it.note?'<span class="lnote">備註：'+esc(it.note)+'</span>':'')+'</span><span>'+money(lineTotal(it))+'</span></li>';}).join('')+'</ul>';}

  function showOrderSuccessDialog(wasEdit, orderName, quantity, total, department){
    if(closeSuccessDialog)closeSuccessDialog();
    dismissInfoToast();
    var previousFocus=document.activeElement, previousOverflow=document.body.style.overflow, stopConfetti, celebrationTimer;
    var overlay=document.createElement('div');
    overlay.className='order-success-overlay';
    overlay.innerHTML='<section class="order-success-dialog" role="dialog" aria-modal="true" aria-labelledby="orderSuccessTitle" aria-describedby="orderSuccessDesc">'+

  async function editAdminOrder(oid,opener){
    if(adminEditBusy||!adminMounted()||!adminUser()||!allowed()||tab!=='pay'||!window.LunchAdminOrderEditor)return;
    adminEditBusy=true;

    function editActive(){return adminMounted()&&adminUser()&&allowed()&&tab==='pay'&&userId()===actor;}

      if(!editActive()||!before[0]||before[0].deleted)throw new Error('目前無法修改這個團的訂單');
      var original=before[1]&&before[1][oid];
      if(!original||original.cancelled)throw new Error('這筆訂單已不存在或已取消');
      var edited=await window.LunchAdminOrderEditor.open({groupId:gid,orderId:oid,group:before[0],order:original,orders:before[1],paid:before[2]||{},receiver:collectionReceiver(before[0],oid),opener:opener});
      var items=Array.isArray(edited)?edited:edited&&edited.items,paidPlan=edited&&Array.isArray(edited.paid)&&edited.paid.length===(items||[]).length?edited.paid:null;
      if(!items||!editActive())return;
      var latest=await Promise.all([DB.get('groups/'+gid),DB.get('orders/'+gid),DB.get('paid/'+gid)]);
      if(!editActive()||sig(latest)!==sig(before))throw new Error('訂單、菜單或收款資料剛剛有更新，請重新開啟修改');
      var stamp=Math.max(now(),Number(original.updatedAt||0)+1),base='orders/'+gid+'/'+oid;
      var total=items.reduce(function(sum,item){return sum+lineTotal(item);},0);
      if(!items.length||!Number.isSafeInteger(total)||total<0)throw new Error('請確認餐點與金額');
      var patch={};patch[base+'/items']=items;patch[base+'/total']=total;patch[base+'/updatedAt']=stamp;
      patch[base+'/lastAdminEdit']={byUid:userId(),at:stamp,fromOrderUpdatedAt:original.updatedAt};
      var next=Object.assign({},before[1]);next[oid]=Object.assign({},original,{items:items,total:total,updatedAt:stamp});
      // 2026-11-24 收款標記逐行：編輯視窗回傳每一行要不要保留已收（金額沒變的原品項保留，其餘改回未收）
      var oldLines=arr(original.items),oldPaid=before[2]&&before[2][oid];
      if(paidPlan){
        var oldPlan=oldLines.map(function(_,i){return !!(oldPaid&&oldPaid[i]===true);});
        if(JSON.stringify(oldPlan)!==JSON.stringify(paidPlan)){var po={};paidPlan.forEach(function(v,i){po[i]=!!v;});patch['paid/'+gid+'/'+oid]=paidPlan.some(Boolean)?po:false;}
      }else{

        if(!sameBilling)patch['paid/'+gid+'/'+oid]=false;
      }
      patch=await financeChangePatch(gid,before[0],before[1],next,patch,false);
      if(!patch||!editActive())return;
      var final=await Promise.all([DB.get('groups/'+gid),DB.get('orders/'+gid),DB.get('paid/'+gid)]);
      if(!editActive()||sig(final)!==sig(before))throw new Error('訂單或收款資料剛剛有更新，修改尚未儲存，請重新確認');
      await DB.update('',patch);

    var sw=e.target.closest('[data-sold]');
    if(sw){var o2={};o2[sw.getAttribute('data-sold')]=sw.getAttribute('aria-checked')!=='true';DB.update('groups/'+gid+'/soldOut',o2).catch(fail);return;}
    if(e.target.closest('#copySum')){
      var txt=sumText(aggregate()),error=$('#summaryCopyError');
      function rejectCopy(message,input){if(error){error.textContent=message;error.hidden=false;}if(input)input.focus();}
      if(copyChoices.deliveryAddress&&!copyValues.deliveryAddress.trim()){rejectCopy('請先填寫送達地址，或取消勾選。',$('#summaryDelivery'));return;}
      if(copyChoices.contactPhone&&!copyValues.contactPhone.trim()){rejectCopy('請先填寫聯絡電話，或取消勾選。',$('#summaryPhone'));return;}
      if(!txt){rejectCopy('請至少勾選一項可複製的內容。');return;}
      copyText(txt,function(){return adminMounted()&&tab==='sum'&&sumText(aggregate())===txt;}).then(function(ok){
        if(ok){toast('已複製勾選內容，可以貼給店家');return;}
        if(!adminMounted()||!$('#cpf'))return;
        $('#cpf').innerHTML='<p class="err" style="margin-top:10px">無法自動複製，請在下面的文字上長按「全選」再複製</p><textarea class="copyfallback" readonly></textarea>';
        var ta=$('#cpf textarea');ta.value=sumText(aggregate());ta.focus();ta.select();});
      return;
    }
    if(e.target.closest('#toggleClose')){
      if(groupClosed(group)){
        if(closeBusy)return;closeBusy=true;updateCloseButton();
        ask({title:'要重新開放這個團購嗎？',okText:'重新開放',cancelText:'先不要'}).then(function(ok){
          if(!ok||!adminMounted()||!allowed()||!groupClosed(group))return;
          var u={closed:false},msg='已重新開放';
          if(now()>=group.deadline){u.deadline=now()+30*60000;msg='已重新開放，截止時間順延到 '+fmtTime(u.deadline);}
          var reopenPatch={};if(hasAdjustment(group))reopenPatch['groups/'+gid+'/adjustment']={shipping:0,discount:0,split:group.adjustment.split||'equal'};Object.keys(u).forEach(function(k){reopenPatch['groups/'+gid+'/'+k]=u[k];});
          return financeChangePatch(gid,group,orders,orders,reopenPatch,true).then(function(patch){if(!patch||!adminMounted()||!allowed()||!groupClosed(group))return;return DB.updateGroupAccess(gid,group,u,patch).then(function(){toast(msg);if(adminMounted())draw();});});
        }).catch(fail).finally(function(){closeBusy=false;if(adminMounted())updateCloseButton();});
      }else{if(closeBusy)return;closeBusy=true;updateCloseButton();ask({title:'要提前結束這個團購嗎？',okText:'提前結束',cancelText:'先不要'}).then(function(ok){if(ok&&adminMounted()&&allowed()&&!groupClosed(group))return DB.updateGroupAccess(gid,group,{closed:true}).then(function(){toast('已提前截止');});}).catch(fail).finally(function(){closeBusy=false;if(adminMounted())updateCloseButton();});}
      return;
    }
    if(e.target.closest('#delG')){
      ask({title:'刪除這個團？',body:'「'+group.title+'」和這團的所有訂單、收錢紀錄會一起刪掉，刪除後無法復原。',okText:'刪除',danger:true}).then(function(ok){
        if(ok&&adminMounted())deleteGroupData(gid).then(function(){toast('團已刪除');location.hash='#/';}).catch(fail);});
    }
  }
  function draw(){
    if(!pageAlive||!got)return;
    if(!mayViewGroup(group)){root.innerHTML='<div class="page">'+emptyBox('找不到這個團，可能連結有誤或已經被刪除。','<br><a class="btn primary" href="#/">回首頁</a>')+'</div>';mode=null;return;}
    if(!allowed()){

    if(mode!=='main')frame();

    if(tab==='pay')body.innerHTML=payHtml(!!body.querySelector('.finance-adjust-details[open]'));
    else if(tab==='sum'){var active=document.activeElement,activeId=active&&active.hasAttribute('data-summary-value')?active.id:null,selection=activeId?[active.selectionStart,active.selectionEnd]:null,previewOpen=!!body.querySelector('.summary-copy-preview[open]');var fallback=!!($('#cpf')&&$('#cpf').firstChild),summary=aggregate();body.innerHTML=sumHtml(summary);if(fallback&&$('#cpf')){$('#cpf').innerHTML='<p class="muted">最新彙整文字（可全選複製）</p><textarea class="copyfallback" readonly></textarea>';$('#cpf textarea').value=sumText(summary);}if(previewOpen&&$('.summary-copy-preview'))$('.summary-copy-preview').open=true;if(activeId&&$('#'+activeId)){$('#'+activeId).focus({preventScroll:true});if(selection&&selection[0]!=null)$('#'+activeId).setSelectionRange(selection[0],selection[1]);}}
    else{
      if(!setBuilt){

          e.preventDefault();var sE=$('#sE');sE.hidden=true;
          var title=$('#stl').value.trim(),owner=$('#sow').value.trim(),dl=parseDT($('#sdd').value,$('#sdt').value);
          function er(m){sE.textContent=m;sE.hidden=false;}

          if(isNaN(dl)){er('請選好截止日期與時間');return;}
          var freeShippingThreshold=parseFreeShippingThreshold($('#sfs').value);
          if(!Number.isFinite(freeShippingThreshold)){er('免運門檻請填 0–1,000,000 的整數，或留白');$('#sfs').focus();return;}
          DB.updateGroupAccess(gid,group,{title:title,owner:owner,deadline:dl,freeShippingThreshold:freeShippingThreshold}).then(function(){toast('設定已儲存');}).catch(fail);
        });
      }
      if(peopleController)peopleController.update(group,orders);
      syncGroupSettings();updateCloseButton();updSold();
    }
  }
  var detailsOff=[];
  function stopDetails(){detailsOff.forEach(function(off){off();});detailsOff=[];orders={};paid={};receivers={};ordersReady=false;receiverReady=false;if(peopleController){peopleController.destroy();peopleController=null;}setBuilt=false;}
  var groupOff=DB.on('groups/'+gid,function(v){
    group=v;got=true;

    draw();
    if(mayViewGroup(group)&&allowed()&&!detailsOff.length){

    }
  },{onError:function(){if(!pageAlive)return;group=null;got=true;stopDetails();draw();}});
  var tm=setInterval(function(){

  return function(){pageAlive=false;if(window.LunchAdminOrderEditor)window.LunchAdminOrderEditor.close();groupOff();stopDetails();clearInterval(tm);};
}

function parseHash(){
  var h=location.hash.replace(/^#/,'')||'/',q={},i=h.indexOf('?');

  return {parts:h.split('/').filter(Boolean),q:q};
}
function route(){
  if(cleanup){try{cleanup();}catch(e){}cleanup=null;}
  var r=parseHash(),p=r.parts;document.title='FOODJUN';

    if(routeGuard&&routeGuard(app,p,r.q,location.hash)===false)return;

  }catch(e){app.innerHTML='<div class="page">'+emptyBox('頁面暫時無法開啟，請重新整理。','<br><a class="btn primary" href="#/">回首頁</a>')+'</div>';}
