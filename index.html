<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>午餐團</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--top-bg:#FFFFFF;--card:#FFFFFF;--text:#111827;--muted:#4B5563;--line:#E5E7EB;--accent:#0E7A4F;--accent-ink:#FFFFFF;--soft:#DCF5E8;--soft-ink:#075C3A;--err:#B91C1C;--radius:20px;--radius-sm:14px;--radius-btn:999px;--font:'Noto Sans TC',sans-serif;--bad-bg:#FEE2E2;--bad-ink:#7F1D1D;--ok-bg:#DCFCE7;--ok-ink:#14532D;--dis-bg:#E5E7EB;--dis-ink:#374151;--warn-bg:#FEF3C7;--warn-ink:#78350F}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,dl,dd{margin:0;padding:0}
ul{list-style:none}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.demo{background:var(--warn-bg);color:var(--warn-ink);font-size:13px;line-height:1.5;text-align:center;padding:4px 12px;border-bottom:1px solid #F3D88A}
.top{background:var(--top-bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brandlink{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);border-radius:50%}
.brand{font-weight:900;font-size:20px}
.nav{margin-left:auto;display:flex;gap:8px}
.page,.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px}
.page>section{margin-bottom:28px}
.page h1.ph{font-size:26px;font-weight:900;line-height:1.35;margin-bottom:4px}
.page h2.sh{font-size:20px;font-weight:900;margin:0 4px 12px}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 10px rgba(17,24,39,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 20px;border-radius:var(--radius-btn);border:1px solid var(--muted);background:var(--card);color:var(--text);font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;line-height:1.3}
.btn.sm{min-height:38px;padding:4px 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.dangerfill{background:var(--err);color:#fff;border-color:var(--err)}
.btn[disabled]{background:var(--dis-bg);color:var(--dis-ink);border-color:var(--dis-bg);cursor:not-allowed}
.hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:22px}
.hero h1{font-size:30px;font-weight:900;line-height:1.3}
.hero p{margin-top:2px}
.hero .btn.primary{background:#fff;color:var(--soft-ink);border-color:#fff}
.hero .btn{border-color:#fff;background:transparent;color:#fff}
.hero .btn.primary{background:#fff;color:var(--soft-ink)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.gcard{display:flex;flex-direction:column;gap:10px}
.gcard h3{font-size:18px;font-weight:900;line-height:1.4;overflow-wrap:anywhere}
.gcard.ended{background:#EEF0F3}
.gcard .actions,.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px}
.meta li{display:inline-flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.meta svg,.info svg{flex:none}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .btn{margin-top:12px}
.tagline{font-size:14px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:0 10px;min-height:24px;border-radius:999px;font-size:13px;font-weight:700;background:var(--soft);color:var(--soft-ink)}
.badge.off{background:var(--dis-bg);color:var(--dis-ink)}
.form{display:grid;gap:16px}
.fld{display:grid;gap:6px}
.fld>label,.fld>.lbl{font-weight:700}
.fld .hint{font-size:14px;color:var(--muted)}
.fld input,.fld select,.fld textarea,.share-row input{width:100%;min-height:46px;padding:8px 16px;background:var(--card);border:1px solid var(--muted);border-radius:var(--radius-sm);font-size:16px}
.fld textarea{min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.7;resize:vertical}
.fld textarea.has-err{border-color:var(--err);border-width:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--err);font-size:14px;font-weight:700}
.errlist{display:grid;gap:6px}
.errlist li{background:var(--bad-bg);color:var(--bad-ink);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.errlist li b{display:block}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.pv h3{font-size:16px;font-weight:900;margin:10px 0 4px}
.pv li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:15px}
.pv li:first-child{border-top:0}
.pv .vs{color:var(--muted)}
.map{width:100%;height:200px;border:0;display:block;border-radius:var(--radius-sm);background:var(--line)}
.maplink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:600;font-size:15px;min-height:40px}
.info{display:grid;gap:6px;margin:8px 0 12px;font-size:15px}
.info li{display:flex;gap:8px;align-items:flex-start;overflow-wrap:anywhere}
.info svg{margin-top:4px}
.share-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.share-row input{flex:1;min-width:200px;min-height:44px;border:1px solid var(--muted);border-radius:var(--radius-btn);padding:8px 16px}
.share h2,.pad h2{font-size:18px;font-weight:900;margin-bottom:4px}
.tabsx{display:flex;gap:8px;margin:0 0 16px;overflow-x:auto;padding:2px}
.tabsx button{flex:none;min-height:42px;padding:6px 20px;border:0;border-radius:var(--radius-btn);background:var(--card);box-shadow:0 1px 4px rgba(17,24,39,.1);font-weight:700;cursor:pointer}
.tabsx button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.num{background:var(--card);border-radius:var(--radius-sm);padding:12px;box-shadow:0 1px 6px rgba(17,24,39,.06);text-align:center}
.num span{display:block;font-size:14px;color:var(--muted)}
.num b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.num.bad b{color:var(--bad-ink)}.num.ok b{color:var(--ok-ink)}
.person{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(17,24,39,.06)}
.p-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.p-name{min-height:40px;padding:4px 16px;border-radius:var(--radius-btn);border:1px solid var(--muted);background:var(--card);font-weight:900;font-size:17px;cursor:pointer;overflow-wrap:anywhere;text-align:left}
.p-sum{font-weight:900;font-variant-numeric:tabular-nums}
.p-state{font-size:14px;color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:8px}
.cell{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px;border-radius:var(--radius-sm);border:2px solid;cursor:pointer;text-align:left;font-size:15px;font-weight:600;max-width:100%}
.cell .t{overflow-wrap:anywhere}
.cell .lb{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:900;padding:1px 8px;border-radius:999px;background:#fff}
.cell.unpaid{background:var(--bad-bg);color:var(--bad-ink);border-color:#B91C1C}
.cell.unpaid .lb{color:var(--bad-ink)}
.cell.paid{background:var(--ok-bg);color:var(--ok-ink);border-color:#15803D}
.cell.paid .lb{color:var(--ok-ink)}
.sumcat h3{font-size:18px;font-weight:900;margin:14px 0 4px}
.sumcat li{padding:6px 0;border-top:1px solid var(--line)}
.sumcat li:first-child{border-top:0}
.sumline{font-weight:700}
.sumnote{padding-left:20px;font-size:14px;color:var(--muted)}
.sumtotal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 0 4px;margin-top:10px;border-top:2px solid var(--text);font-weight:900;font-size:18px}
.copyfallback{width:100%;min-height:160px;margin-top:10px;padding:10px;border:1px solid var(--muted);border-radius:var(--radius-sm);font-size:14px}
.setrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{font-weight:700}
.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
/* order page (style C) */
.wrap{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"group" "shop" "mine" "menu" "all";gap:16px;padding-bottom:110px}
.group{grid-area:group;min-width:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:20px}
.group.ended{background:#374151}
.side{display:contents}.shop{grid-area:shop;min-width:0}.menu{grid-area:menu;min-width:0}.mine{grid-area:mine;min-width:0}.all{grid-area:all;min-width:0}
.eyebrow{font-size:14px;margin-bottom:4px;font-weight:500}
.group h1{font-size:24px;line-height:1.35;overflow-wrap:anywhere;font-weight:900}
.group .meta{margin-top:12px}
.shop h2,.cart h2,.mine h2,.all summary{font-size:18px;font-weight:900;margin-bottom:10px}
.shop,.cart-card,.mine,.all{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 10px rgba(17,24,39,.06)}
.shop .sname{font-weight:700;font-size:17px}
.all summary{cursor:pointer;margin:0;list-style:none;display:flex;justify-content:space-between;align-items:center}
.all summary::-webkit-details-marker{display:none}
.all[open] summary{margin-bottom:10px}
.all .chev{transition:transform .2s}.all[open] .chev{transform:rotate(180deg)}
.olist{display:grid;gap:10px}
.ob{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px}
.ob .oh{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.ob ul{margin-top:4px;font-size:15px}
.ob li{display:flex;justify-content:space-between;gap:10px}
.ob .lnote{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ob .actions{margin-top:8px}
.tabs{position:sticky;top:0;z-index:10;display:flex;gap:8px;padding:10px 0;background:var(--bg);overflow-x:auto}
.tab{flex:none;min-height:40px;padding:6px 18px;cursor:pointer;background:var(--card);border:0;box-shadow:0 1px 4px rgba(17,24,39,.1);border-radius:var(--radius-btn);color:var(--text);font-weight:700}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.cat{scroll-margin-top:64px;margin-bottom:20px}
.cat h2{font-size:22px;font-weight:900;margin:6px 4px 10px}
.cat h2 small{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:var(--radius);padding:12px 16px;box-shadow:0 1px 6px rgba(17,24,39,.06)}
.row{display:flex;align-items:center;gap:12px;min-height:44px}
.iname{flex:1;min-width:0;font-weight:700;font-size:17px;overflow-wrap:anywhere}
.vrow .vlabel{flex:1;min-width:0;padding-left:12px}
.price{font-variant-numeric:tabular-nums;font-size:20px;font-weight:900;color:var(--accent);white-space:nowrap}
.vrow .price{font-size:18px}
.qty{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;width:124px;flex:none}
.q-btn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;background:var(--card);border:1px solid var(--muted);border-radius:var(--radius-btn)}
.q-btn.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q-btn[disabled]{background:var(--dis-bg);color:var(--dis-ink);border-color:var(--dis-bg);cursor:not-allowed}
.q-n{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty.zero .minus,.qty.zero .q-n{display:none}
.notebtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:4px 0;min-height:32px;cursor:pointer;color:var(--accent);font-size:14px;text-decoration:underline}
.notebtn[disabled]{color:var(--dis-ink);cursor:not-allowed}
.note input{width:100%;min-height:42px;padding:8px 18px;margin:2px 0 6px;background:var(--card);border:1px solid var(--muted);border-radius:999px;font-size:16px}
.note input[disabled]{background:var(--dis-bg);color:var(--dis-ink)}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;max-height:85vh;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.1)}
.cart-body{display:none;overflow:auto;padding:16px}
.cart.open .cart-body{display:block}
.cart-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:10px 16px;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:900;border-radius:var(--radius) var(--radius) 0 0}
.cart-bar .chev{transition:transform .2s}.cart.open .chev{transform:rotate(180deg)}
.lines{display:grid;gap:8px;max-height:30vh;overflow:auto;margin-bottom:12px;font-size:15px}
.lines li{display:flex;justify-content:space-between;gap:10px}
.lines .lnote{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lines .emp{color:var(--muted)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);margin-bottom:10px}
.sum b{font-variant-numeric:tabular-nums;font-size:26px;font-weight:900}
.sum span b{font-size:inherit}
.field{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.field label{font-weight:600;flex:none}
.field input{flex:1;min-width:120px;min-height:44px;padding:8px 18px;background:var(--card);border:1px solid var(--muted);border-radius:999px;font-size:16px}
.field input[disabled]{background:var(--dis-bg);color:var(--dis-ink)}
.field .err{flex-basis:100%}
.submit{width:100%;min-height:52px;border:0;cursor:pointer;font-weight:900;font-size:17px;background:var(--accent);color:var(--accent-ink);border-radius:var(--radius-btn)}
.submit[disabled]{background:var(--dis-bg);color:var(--dis-ink);cursor:not-allowed}
.editing{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.closedmsg{background:var(--dis-bg);color:var(--dis-ink);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:10px;font-weight:700;font-size:15px}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 24px);padding:12px 18px;background:var(--soft);color:var(--soft-ink);border:1px solid var(--soft-ink);border-radius:var(--radius-sm);font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#toast.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-ink)}
.modal-ov{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:var(--radius);padding:22px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h2{font-size:20px;font-weight:900;margin-bottom:6px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal input{width:100%;min-height:46px;padding:8px 16px;border:1px solid var(--muted);border-radius:var(--radius-sm);margin-top:10px;font-size:16px}
.gate{max-width:420px;margin:24px auto}
@media(min-width:900px){
.wrap{grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"group side" "mine side" "menu side" "all side";column-gap:36px;padding-bottom:48px}
.side{display:block;grid-area:side;position:sticky;top:16px;align-self:start}
.shop{margin-bottom:16px}
.map{height:220px}
.group h1{font-size:30px}
.cart{position:static;max-height:none;box-shadow:0 2px 10px rgba(17,24,39,.06);border-radius:var(--radius)}
.cart-bar{display:none}
.cart-body{display:block;overflow:visible;padding:0}
.cart-pad{padding:18px}
.lines{max-height:26vh}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media(max-width:899px){.cart-pad{padding:0}}
@media(max-width:480px){.nums{gap:6px}.num b{font-size:19px}.hero h1{font-size:26px}}
/* v2: options, picker, promos, admin */
.promos{grid-area:promo;display:grid;gap:8px;min-width:0}
.promo{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:0 1px 6px rgba(17,24,39,.06);overflow-wrap:anywhere}
.promo .badge{flex:none;background:var(--soft-ink);color:#fff;margin-top:1px}
.itemhit{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;min-height:44px}
.itemhit:disabled{cursor:not-allowed}
.itemhit .iname{display:inline;flex:none}
.item .gnames{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.soldtag{display:none;margin-left:6px;vertical-align:middle}
.item.off{background:#EEF0F3;box-shadow:none}
.item.off .soldtag{display:inline-flex}
.item.off .iname,.item.off .price{color:var(--dis-ink)}
.pk-ov{position:fixed;inset:0;z-index:55;background:rgba(17,24,39,.55);display:flex;align-items:flex-end;justify-content:center}
.pk{background:var(--card);width:100%;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:pkup .2s ease-out}
@keyframes pkup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.pk-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 6px}
.pk-h h2{font-size:20px;font-weight:900;line-height:1.35;overflow-wrap:anywhere}
.pk-x{flex:none;width:44px;height:44px;border-radius:999px;border:1px solid var(--muted);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pk-b{overflow:auto;padding:0 16px 12px;flex:1 1 auto;min-height:0}
.pk-f{display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none}
.pg{margin:14px 0 0}
.pg-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900;margin-bottom:6px}
.pg-tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:700;background:var(--dis-bg);color:var(--dis-ink)}
.pg-tag.req{background:var(--bad-bg);color:var(--bad-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--muted);background:var(--card);color:var(--text);font-weight:700;font-size:15px;cursor:pointer;max-width:100%;overflow-wrap:anywhere;text-align:center}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .ad{font-weight:500}
.gerr{color:var(--err);font-weight:700;font-size:14px;margin-top:6px}
.pk-note{width:100%;min-height:44px;padding:8px 16px;background:var(--card);border:1px solid var(--muted);border-radius:999px;font-size:16px}
.pk-q{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.qctl{display:inline-flex;align-items:center;gap:8px}
.qctl .q-btn{width:44px;height:44px}

function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function needVal(v,where){if(v===null||v===undefined)throw new Error('不可寫入空值（'+where+'）；本系統只做軟刪除');}
function cleanJSON(v){return JSON.parse(JSON.stringify(v));}
function segs(p){return String(p).split('/').filter(Boolean);}

var LocalDB=(function(){
  var KEY='lunch_demo_db_v1',data=load(),ls=[];
  var bc=null;try{if('BroadcastChannel' in window){bc=new BroadcastChannel(KEY);}}catch(e){}
  function load(){try{var v=JSON.parse(localStorage.getItem(KEY));return v&&typeof v==='object'?v:{};}catch(e){return {};}}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}if(bc)bc.postMessage(Date.now());}
  function getAt(p){var o=data,s=segs(p);for(var i=0;i<s.length;i++){if(o==null||typeof o!=='object')return null;o=o[s[i]];}return o===undefined?null:o;}
  function setAt(p,v){var s=segs(p);if(!s.length)throw new Error('不可覆寫整個資料庫');var o=data;for(var i=0;i<s.length-1;i++){if(o[s[i]]==null||typeof o[s[i]]!=='object')o[s[i]]={};o=o[s[i]];}o[s[s.length-1]]=cleanJSON(v);}
  function notify(){ls.slice().forEach(function(l){var v=getAt(l.p),j=JSON.stringify(v);if(l.first||j!==l.last){l.first=false;l.last=j;l.cb(v==null?null:cleanJSON(v));}});}
  function reload(){data=load();notify();}
  if(bc)bc.onmessage=reload;
  window.addEventListener('storage',function(e){if(e.key===KEY)reload();});
  return {
    on:function(p,cb){var l={p:p,cb:cb,first:true,last:null};ls.push(l);var v=getAt(p);l.first=false;l.last=JSON.stringify(v);cb(v==null?null:cleanJSON(v));return function(){var i=ls.indexOf(l);if(i>=0)ls.splice(i,1);};},
    get:function(p){return Promise.resolve(getAt(p)==null?null:cleanJSON(getAt(p)));},
    set:function(p,v){try{needVal(v,p);data=load();setAt(p,v);persist();notify();return Promise.resolve();}catch(e){return Promise.reject(e);}},
    update:function(p,o){try{data=load();Object.keys(o).forEach(function(k){needVal(o[k],p+'/'+k);setAt(p+'/'+k,o[k]);});persist();notify();return Promise.resolve();}catch(e){return Promise.reject(e);}}
  };
})();

var FbDB=(function(){
  var ready=null;
  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('載入 Firebase 失敗'));};document.head.appendChild(s);});}
  function init(){
    if(!ready){ready=loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js').then(function(){return loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');}).then(function(){
      if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
      return firebase.database();});}
    return ready;
  }
  return {
    on:function(p,cb){var dead=false,off=null;init().then(function(db){if(dead)return;var ref=db.ref(p);var h=ref.on('value',function(s){cb(s.val());},function(e){toast('讀取資料失敗：'+e.message,true);});off=function(){ref.off('value',h);};}).catch(function(e){toast(e.message,true);});return function(){dead=true;if(off)off();};},
    get:function(p){return init().then(function(db){return db.ref(p).once('value');}).then(function(s){return s.val();});},
    set:function(p,v){try{needVal(v,p);}catch(e){return Promise.reject(e);}return init().then(function(db){return db.ref(p).set(cleanJSON(v));});},
    update:function(p,o){try{Object.keys(o).forEach(function(k){needVal(o[k],p+'/'+k);});}catch(e){return Promise.reject(e);}return init().then(function(db){return db.ref(p).update(cleanJSON(o));});}
  };
})();

/* ---------- 菜單格式 ---------- */
function normLine(s){return s.replace(/[，﹐､]/g,',').replace(/｛/g,'{').replace(/｝/g,'}').replace(/　/g,' ').replace(/＄/g,'$').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).trim();}
var BULLET=/^[ \t　]*-[ \t　]+/;
function isIndented(raw){
  if(BULLET.test(raw))return true;
  var lead=/^[ \t　]*/.exec(raw)[0];
  return lead.replace(/[\t　]/g,'  ').length>=2;
}
function parseGroup(s){
  s=s.replace(/：/g,':').replace(/＊/g,'*').replace(/＋/g,'+');
  var i=s.indexOf(':');
  if(i<0)return {err:'選項群組要寫成「群組名: 選項, 選項」，例如 甜度*: 全糖, 半糖'};
  var name=s.slice(0,i).trim(),req=false;
  if(/\*$/.test(name)){req=true;name=name.replace(/\s*\*+$/,'').trim();}
  if(!name)return {err:'選項群組少了名稱'};
  var parts=s.slice(i+1).split(',').map(function(x){return x.trim();});
  if(parts.length===1&&!parts[0])return {err:'「'+name+'」後面沒有任何選項'};
  var opts=[],seen={};
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(!p)return {err:'「'+name+'」的選項之間有空白（多打了逗號）'};
    var m=/^(.*?)\s*\+\s*\$?\s*(\d+)\s*元?$/.exec(p),n=p,add=0;
    if(m){n=m[1].trim();add=parseInt(m[2],10);if(!n)return {err:'加價「'+p+'」前面少了選項名稱'};}
    else if(p.indexOf('+')>=0)return {err:'加價要寫成「選項+數字」，例如 大杯+20，「'+p+'」看不懂'};
    if(seen[n])return {err:'「'+name+'」裡的選項「'+n+'」重複了'};
    seen[n]=true;opts.push({n:n,add:add});
  }
  return {g:{n:name,req:req,o:opts}};
}
function parseMenu(text){
  var cats=[],errors=[],cur=null,curItem=null,count=0;
  String(text||'').split(/\r?\n/).forEach(function(raw,idx){
    if(!raw.trim())return;
    var ln=idx+1;
    function bad(msg){errors.push({line:ln,text:raw.trim(),msg:msg});}
    if(isIndented(raw)){
      var g=parseGroup(normLine(raw.replace(BULLET,'')));
      if(g.err){bad(g.err);return;}
      var tgt=curItem?curItem._own:(cur?cur._cg:null);
      if(!tgt){bad('選項群組要寫在品項下面（或分類下面），這行前面還沒有品項或分類');return;}
      if(tgt.some(function(x){return x.n===g.g.n;})){bad('同一個地方已經有叫「'+g.g.n+'」的群組了');return;}
      tgt.push(g.g);return;
    }
    var s=normLine(raw);if(!s)return;
    if(s.charAt(0)==='{'){
      var m=/^\{\s*([^{}]*?)\s*\}$/.exec(s);
      if(!m||!m[1]){bad('分類要寫成 {分類名稱}，例如 {麵食}');return;}
      cur={c:m[1],items:[],_cg:[]};cats.push(cur);curItem=null;return;
    }
    var parts=s.split(',').map(function(x){return x.trim();});
    if(!parts[0]){bad('這行少了品名');return;}
    if(parts.length<2){bad('缺少價格，請寫成「品名, 價格」');return;}
    var rest=parts.slice(1),item={n:parts[0],_own:[]};
    if(rest[rest.length-1]==='停售'){item.so=true;rest.pop();}
    if(!rest.length){bad('缺少價格，請寫成「品名, 價格」');return;}
    if(/^\$?\d+元?$/.test(rest[0])){
      if(rest.length>1){bad('價格後面多了看不懂的「'+rest[1]+'」；停售要寫在最後，例如 品名, 50, 停售');return;}
      item.p=parseInt(rest[0].replace(/[^\d]/g,''),10);
    }else{
      var v=[],badPart=null;
      for(var i=0;i<rest.length;i++){var m2=/^(.+?)\s+\$?(\d+)元?$/.exec(rest[i]);if(!m2){badPart=rest[i];break;}v.push([m2[1].trim(),parseInt(m2[2],10)]);}
      if(badPart!==null){
        bad(rest.length===1&&!/\s/.test(badPart)?'價格「'+badPart+'」不是整數數字，例如 65':'「'+(badPart||'（空白）')+'」看不懂，舊式細項要寫成「細項 價格」，例如 中辣 65');return;
      }
      var min=Math.min.apply(null,v.map(function(x){return x[1];}));
      item.p=min;item._own.push({n:'規格',req:true,o:v.map(function(x){return {n:x[0],add:x[1]-min};})});
    }
    if(!cur){cur={c:'其他',items:[],_cg:[]};cats.push(cur);}
    cur.items.push(item);curItem=item;count++;
  });
  cats.forEach(function(c){
    c.items.forEach(function(it){
      var g=it._own.slice();
      c._cg.forEach(function(cg){if(!it._own.some(function(o){return o.n===cg.n;}))g.push(cg);});
      var all=g.filter(function(x){return x.req;}).concat(g.filter(function(x){return !x.req;}));
      delete it._own;
      if(all.length)it.g=all;
    });
    delete c._cg;
  });
  return {cats:cats.filter(function(c){return c.items.length;}),errors:errors,count:count};
}
function legacyMenuText(menu){
  return menu.map(function(c){return '{'+c.c+'}\n'+c.items.map(function(it){return it.v?it.n+', '+it.v.map(function(x){return x[0]+' '+x[1];}).join(', '):it.n+', '+it.p;}).join('\n');}).join('\n');
}
function menuOf(shop){
  return arr(shop&&shop.menu).map(function(c){return {c:c.c,items:arr(c.items).map(function(it){
    var o={n:it.n,p:Number(it.p)||0,so:!!it.so,g:arr(it.g).map(function(g){return {n:g.n,req:!!g.req,o:arr(g.o).map(function(x){return {n:x.n,add:Number(x.add)||0};})};})};
    if(it.v){
      var vs=arr(it.v).map(function(x){return arr(x);}),min=Math.min.apply(null,vs.map(function(x){return Number(x[1]);}));
      o.p=min;o.g=[{n:'規格',req:true,o:vs.map(function(x){return {n:x[0],add:Number(x[1])-min};})}].concat(o.g);
    }
    return o;})};});
}
function countItems(text){return parseMenu(text).count;}

  function openPicker(ik,opener){

    var ov=document.createElement('div');ov.className='pk-ov';
    var gh=it.g.map(function(g,gi){
      return '<div class="pg" data-gi="'+gi+'"><div class="pg-h"><span>'+esc(g.n)+'</span><span class="pg-tag'+(g.req?' req':'')+'">'+(g.req?'必選':'可複選')+'</span></div><div class="chips" role="group" aria-label="'+esc(g.n)+'">'+g.o.map(function(o,oi){return '<button type="button" class="chip" data-gi="'+gi+'" data-oi="'+oi+'" aria-pressed="false">'+esc(o.n)+(o.add?'<span class="ad"> +$'+o.add+'</span>':'')+'</button>';}).join('')+'</div><p class="gerr" role="alert" hidden>請選一個</p></div>';
    }).join('');

    var prevOverflow=document.body.style.overflow;
    document.body.appendChild(ov);document.body.style.overflow='hidden';
    function total(){var u=it.p;sel.forEach(function(s,gi){s.forEach(function(oi){u+=it.g[gi].o[oi].add;});});return u*qn;}
    function paint(){
      Array.prototype.forEach.call(ov.querySelectorAll('.chip'),function(c){c.setAttribute('aria-pressed',String(sel[+c.getAttribute('data-gi')].indexOf(+c.getAttribute('data-oi'))>=0));});
      ov.querySelector('#pkN').textContent=qn;
      ov.querySelector('[data-q="-"]').disabled=qn<=1;ov.querySelector('[data-q="+"]').disabled=qn>=99;
      ov.querySelector('#pkOk').textContent='加入購物車 '+money(total());
    }
    function close(){
      document.removeEventListener('keydown',key);document.body.style.overflow=prevOverflow;
      if(ov.parentNode)ov.parentNode.removeChild(ov);closePicker=null;
      if(opener&&opener.focus&&document.body.contains(opener))opener.focus();
    }
    function key(e){
      if(e.key!=='Tab')return;
      var f=Array.prototype.filter.call(ov.querySelectorAll('button,input'),function(x){return !x.disabled;});if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
    document.addEventListener('keydown',key);
    closePicker=close;
    ov.addEventListener('click',function(e){
      var x=e.target.closest('[data-x]');if(x){close();return;}
      var ch=e.target.closest('.chip');
      if(ch){
        var gi=+ch.getAttribute('data-gi'),oi=+ch.getAttribute('data-oi'),g=it.g[gi],s=sel[gi],pos=s.indexOf(oi);
        if(g.req)sel[gi]=[oi];else if(pos>=0)s.splice(pos,1);else s.push(oi);
        ov.querySelector('.pg[data-gi="'+gi+'"] .gerr').hidden=true;paint();return;
      }
      var q=e.target.closest('[data-q]');
      if(q){qn=Math.max(1,Math.min(99,qn+(q.getAttribute('data-q')==='+'?1:-1)));paint();return;}
      if(e.target.closest('[data-ok]')){
        if(groupClosed(group)){toast('這個團已截止',true);close();return;}
        if(sold(ik)){toast('「'+it.n+'」剛剛被標成停售了',true);close();return;}
        var firstBad=null;
        it.g.forEach(function(g,gi){if(g.req&&!sel[gi].length){var er=ov.querySelector('.pg[data-gi="'+gi+'"] .gerr');er.hidden=false;if(!firstBad)firstBad=er;}});
        if(firstBad){firstBad.scrollIntoView({block:'nearest'});return;}
        var opts=[];
        it.g.forEach(function(g,gi){sel[gi].slice().sort(function(a,b){return a-b;}).forEach(function(oi){opts.push({group:g.n,choice:g.o[oi].n,add:g.o[oi].add});});});
        addLine({ik:ik,cat:ref.cat,item:it.n,base:it.p,options:opts,note:ov.querySelector('.pk-note').value.trim(),qty:qn});
        close();update();$('#cartErr').hidden=true;toast('已加入「'+it.n+'」');
      }
    });
    paint();
    var f1=ov.querySelector('.chip')||ov.querySelector('.pk-note');if(f1)f1.focus();
  }

  function wire(){
    menuEl=$('#menu');linesEl=$('#lines');
    var tabsEl=$('#tabs'),cartEl=$('#cart'),bar=$('#bar'),uname=$('#uname');
    menuEl.addEventListener('click',function(e){
      var o=e.target.closest('[data-open]'),a=e.target.closest('[data-add]');
      if(!o&&!a)return;
      var btn=o||a,ik=btn.getAttribute(o?'data-open':'data-add');
      if(groupClosed(group)){toast('這個團已截止',true);return;}
      var ref=itemIdx[ik],it=ref.it;
      if(sold(ik)){toast('「'+it.n+'」已停售',true);return;}
      if(a&&!it.g.length){addLine({ik:ik,cat:ref.cat,item:it.n,base:it.p,options:[],note:'',qty:1});update();$('#cartErr').hidden=true;toast('已加入「'+it.n+'」');return;}

    });
    linesEl.addEventListener('click',function(e){
      var b=e.target.closest('[data-cm]');if(!b||groupClosed(group))return;
      var i=+b.getAttribute('data-ci'),l=cart[i],act=b.getAttribute('data-cm');if(!l)return;
      if(act==='-')l.qty=Math.max(1,l.qty-1);else if(act==='+')l.qty=Math.min(99,l.qty+1);else cart.splice(i,1);

    uname.addEventListener('input',function(){$('#nameErr').hidden=true;uname.removeAttribute('aria-invalid');});
    $('#editCancel').addEventListener('click',function(){setEditing(null);resetCart();});
    $('#submit').addEventListener('click',function(){
      if(groupClosed(group)){toast('這個團已截止',true);refresh();return;}
      var name=uname.value.trim(),okCart=update()>0;
      $('#nameErr').hidden=!!name;$('#cartErr').hidden=okCart;
      if(name)uname.removeAttribute('aria-invalid');else uname.setAttribute('aria-invalid','true');

      if(!okCart)return;
      var stopped=cart.filter(function(l){return sold(l.ik);});
      if(stopped.length){
        toast('「'+stopped.map(function(l){return l.item;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join('、')+'」已停售，請先從購物車刪除再送出',true);
        cartEl.classList.toggle('open',true);bar.setAttribute('aria-expanded','true');return;
      }
      var items=[],total=0;
      cart.forEach(function(l){var unit=unitOf(l);items.push({cat:l.cat,item:l.item,base:l.base,options:l.options,unit:unit,qty:l.qty,note:l.note});total+=unit*l.qty;});
      var now=Date.now(),oid=editingId||DB.newId(),wasEdit=!!editingId,p;
      addMyOrder(gid,oid);
      if(wasEdit){
        p=DB.update('orders/'+gid+'/'+oid,{name:name,items:items,total:total,updatedAt:now}).then(function(){
          return DB.get('paid/'+gid+'/'+oid).then(function(pd){
            if(!pd)return;var o={};for(var i=0;i<Math.max(items.length,arr(pd).length);i++)o[i]=false;return DB.update('paid/'+gid+'/'+oid,o);});
        });
      }else p=DB.set('orders/'+gid+'/'+oid,{name:name,items:items,total:total,createdAt:now,updatedAt:now});
      p.then(function(){
        LS.set(K.name,name);setEditing(null);resetCart();
        cartEl.classList.toggle('open',false);bar.setAttribute('aria-expanded','false');
        toast(wasEdit?'訂單已更新':'訂單已送出，謝謝！');
      }).catch(fail);
    });
    tabsEl.addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;$('#cat-'+b.getAttribute('data-t')).scrollIntoView({behavior:'smooth',block:'start'});});
    $('#mineL').addEventListener('click',function(e){
      if(groupClosed(group))return;
      var ed=e.target.closest('[data-edit]'),ca=e.target.closest('[data-cancel]');
      if(ed){var o=orders[ed.getAttribute('data-edit')];if(o){o.id=ed.getAttribute('data-edit');loadOrder(o);}}
      if(ca){var id=ca.getAttribute('data-cancel'),oo=orders[id];
        ask({title:'取消這筆訂單？',body:(oo?oo.name+'，'+money(orderTotal(oo)):'')+'。取消後負責人就不會幫你叫餐。',okText:'取消訂單',cancelText:'先不要',danger:true}).then(function(ok){
          if(!ok)return;if(groupClosed(group)){toast('已截止，不能取消',true);return;}
          DB.update('orders/'+gid+'/'+id,{cancelled:true,updatedAt:Date.now()}).then(function(){toast('訂單已取消');}).catch(fail);});}
    });
    function setActive(){var cur=0;menu.forEach(function(c,i){var el=document.getElementById('cat-'+i);if(el&&el.getBoundingClientRect().top<=90)cur=i;});Array.prototype.forEach.call(tabsEl.children,function(b,i){b.setAttribute('aria-current',String(i===cur));});}
    window.addEventListener('scroll',setActive,{passive:true});scrollOff=function(){window.removeEventListener('scroll',setActive);};
    setActive();update();
  }
  var scrollOff=null;
  function onData(){
    if(!got)return;
    if(!group||group.deleted){if(closePicker)closePicker();if(built||root.querySelector('.muted'))notFound();return;}

}

function pageAdmin(root,gid,q){

    var live=liveOrders(orders),total=0,got2=0;

    var h='<div class="nums"><div class="num"><span>應收</span><b>'+money(total)+'</b></div><div class="num ok"><span>已收</span><b>'+money(got2)+'</b></div><div class="num bad"><span>未收</span><b>'+money(total-got2)+'</b></div></div>';

  function aggregate(){
    var map={},order=[],live=liveOrders(orders),totalQty=0,totalMoney=0;
    live.forEach(function(o){lines(o).forEach(function(it){
      var k=it.cat+'\u0001'+it.item+'\u0001'+optSig(it);
      if(!map[k]){map[k]={cat:it.cat,item:it.item,label:lineLabel(it),qty:0,notes:[]};order.push(k);}
      var m=map[k];m.qty+=Number(it.qty)||0;totalQty+=Number(it.qty)||0;totalMoney+=lineTotal(it);
      if(it.note){var tx=o.name+'：'+it.note;if(m.notes.indexOf(tx)<0)m.notes.push(tx);}
    });});
    var rank={},r=0;menuOf(group.shop).forEach(function(c){c.items.forEach(function(it){rank[c.c+'\u0001'+it.n]=r++;});});
    function rk(k){var p=k.split('\u0001'),v=rank[p[0]+'\u0001'+p[1]];return v==null?1e6:v;}
    order.sort(function(a,b){return rk(a)-rk(b);});
    var cats=[],cm={};

  }
  function setHtml(){
    return '<div class="card"><form class="form" id="sf" novalidate><p>目前狀態：<span class="stat" id="stat"></span></p><div class="setrow"><button type="button" class="btn" id="toggleClose"></button></div><hr class="sep" style="margin:2px 0"><div class="fld"><label for="stl">團名</label><input id="stl" maxlength="40" value="'+esc(group.title)+'" autocomplete="off"></div><div class="fld"><label for="sow">負責人</label><input id="sow" maxlength="20" value="'+esc(group.owner)+'" autocomplete="off"></div><div class="row2"><div class="fld"><label for="sdd">截止日期</label><input id="sdd" type="date" value="'+dateVal(group.deadline)+'"></div><div class="fld"><label for="sdt">截止時間</label><input id="sdt" type="time" value="'+fmtTime(group.deadline)+'"></div></div><p class="err" id="sE" role="alert" hidden></p><div class="actions"><button type="submit" class="btn primary">儲存設定</button></div></form></div><div style="height:16px"></div><div class="card"><h2 style="font-size:18px;font-weight:900;margin-bottom:4px">停售品項</h2><p class="muted">打開開關＝停售。點餐頁會馬上變灰、不能再加入；已經放進別人購物車的，送出時會被擋下。</p><div id="solds">'+soldHtml()+'</div></div><div style="height:16px"></div>'+shareBlock(gid)+'<div style="height:16px"></div><div class="card"><h2 style="font-size:18px;font-weight:900;margin-bottom:4px">刪除這個團</h2><p class="muted">刪除後首頁和連結都看不到這個團（資料不會真的消失）。</p><div class="actions"><button type="button" class="btn danger" id="delG">刪除這個團</button></div></div>';
  }
  function updStat(){
    var st=$('#stat');if(!st)return;st.textContent=statusText();
    var tc=$('#toggleClose');tc.textContent=groupClosed(group)?'重新開放':'提前截止';
    tc.className='btn '+(groupClosed(group)?'primary':'danger');
  }
  function bodyClick(e){
    var cell=e.target.closest('.cell');
    if(cell){var oid=cell.getAttribute('data-o'),i=cell.getAttribute('data-i');DB.set('paid/'+gid+'/'+oid+'/'+i,!isPaid(oid,i)).catch(fail);return;}
    var all=e.target.closest('[data-all]');
    if(all){var id=all.getAttribute('data-all'),o=orders[id],ls=arr(o.items),allPaid=ls.every(function(it,i){return isPaid(id,i);}),obj={};ls.forEach(function(it,i){obj[i]=!allPaid;});DB.update('paid/'+gid+'/'+id,obj).catch(fail);return;}
    var del=e.target.closest('[data-del]');
    if(del){
      var did=del.getAttribute('data-del'),dn=orders[did]?orders[did].name:'';
      ask({title:'確定刪除 '+dn+' 的訂單？',body:'這筆訂單會從收錢和叫餐彙整中拿掉，應收、已收、未收會跟著更新。',okText:'刪除',cancelText:'先不要',danger:true}).then(function(ok){
        if(ok)DB.update('orders/'+gid+'/'+did,{cancelled:true,updatedAt:Date.now()}).then(function(){toast('已刪除 '+dn+' 的訂單');}).catch(fail);
      });
      return;
    }
    var sw=e.target.closest('[data-sold]');
    if(sw){var o2={};o2[sw.getAttribute('data-sold')]=sw.getAttribute('aria-checked')!=='true';DB.update('groups/'+gid+'/soldOut',o2).catch(fail);return;}
    if(e.target.closest('#copySum')){
      var txt=sumText(aggregate());
      copyText(txt).then(function(ok){
        if(ok){toast('已複製，可以貼到 LINE');return;}
        $('#cpf').innerHTML='<p class="err" style="margin-top:10px">無法自動複製，請在下面的文字上長按「全選」再複製</p><textarea class="copyfallback" readonly></textarea>';
        var ta=$('#cpf textarea');ta.value=txt;ta.focus();ta.select();});
      return;
    }
    if(e.target.closest('#toggleClose')){
      if(groupClosed(group)){
        var u={closed:false},msg='已重新開放';
        if(Date.now()>=group.deadline){u.deadline=Date.now()+30*60000;msg='已重新開放，截止時間順延到 '+fmtTime(u.deadline);}
        DB.update('groups/'+gid,u).then(function(){toast(msg);setBuilt=false;}).catch(fail);
      }else DB.update('groups/'+gid,{closed:true}).then(function(){toast('已提前截止');}).catch(fail);
      return;
    }
    if(e.target.closest('#delG')){
      ask({title:'刪除這個團？',body:'「'+group.title+'」會從首頁消失，同事的連結也會打不開。',okText:'刪除',danger:true}).then(function(ok){
        if(ok)DB.update('groups/'+gid,{deleted:true}).then(function(){toast('團已刪除');location.hash='#/';}).catch(fail);});
    }
  }
  function draw(){
    if(!got)return;
    if(!group||group.deleted){root.innerHTML='<div class="page">'+emptyBox('找不到這個團，可能連結有誤或已經被刪除。','<br><a class="btn primary" href="#/">回首頁</a>')+'</div>';mode=null;return;}
    if(!allowed()){if(mode!=='gate')gate();return;}
    if(mode!=='main')frame();
    Array.prototype.forEach.call($('#tx').children,function(b){b.setAttribute('aria-current',String(b.getAttribute('data-t')===tab));b.setAttribute('role','tab');});
    var body=$('#body');
    if(tab==='pay')body.innerHTML=payHtml();
    else if(tab==='sum'){var had=$('#cpf')&&$('#cpf').firstChild;if(!had)body.innerHTML=sumHtml(aggregate());}
    else{
      if(!setBuilt){
        body.innerHTML=setHtml();setBuilt=true;wireShare(body,gid,group.title);
        $('#sf').addEventListener('submit',function(e){
          e.preventDefault();var sE=$('#sE');sE.hidden=true;
          var title=$('#stl').value.trim(),owner=$('#sow').value.trim(),dl=parseDT($('#sdd').value,$('#sdt').value);
          function er(m){sE.textContent=m;sE.hidden=false;}
          if(!title||!owner){er('團名和負責人都要填');return;}
          if(isNaN(dl)){er('請選好截止日期與時間');return;}
          DB.update('groups/'+gid,{title:title,owner:owner,deadline:dl}).then(function(){toast('設定已儲存');}).catch(fail);
        });
      }
      updStat();updSold();
    }
  }
  var offs=[DB.on('groups/'+gid,function(v){group=v;got=true;draw();}),DB.on('orders/'+gid,function(v){orders=v||{};if(mode==='main'&&tab!=='set')draw();}),DB.on('paid/'+gid,function(v){paid=v||{};if(mode==='main'&&tab==='pay')draw();})];
  var tm=setInterval(function(){if(mode==='main'&&tab==='set')updStat();},1000);
  return function(){offs.forEach(function(f){f();});clearInterval(tm);};
}

/* ---------- 路由 ---------- */
var app=document.getElementById('app'),cleanup=null;
function parseHash(){
  var h=location.hash.replace(/^#/,'')||'/',q={},i=h.indexOf('?');
  if(i>=0){h.slice(i+1).split('&').forEach(function(kv){if(!kv)return;var p=kv.split('=');try{q[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||'');}catch(e){}});h=h.slice(0,i);}
  return {parts:h.split('/').filter(Boolean),q:q};
}
function route(){
  if(cleanup){try{cleanup();}catch(e){}cleanup=null;}
  var r=parseHash(),p=r.parts;document.title='午餐團';
  window.scrollTo(0,0);
  try{
    if(!p.length)cleanup=pageHome(app);
    else if(p[0]==='shops'&&p.length===1)cleanup=pageShops(app);
    else if(p[0]==='shops'&&p.length===2)cleanup=pageShopEdit(app,p[1]);
    else if(p[0]==='new')cleanup=pageNew(app,r.q);
    else if(p[0]==='g'&&p.length===2)cleanup=pageGroup(app,p[1]);
    else if(p[0]==='g'&&p[2]==='admin')cleanup=pageAdmin(app,p[1],r.q);
    else app.innerHTML='<div class="page">'+emptyBox('找不到這一頁。','<br><a class="btn primary" href="#/">回首頁</a>')+'</div>';
  }catch(e){app.innerHTML='<div class="page">'+emptyBox('頁面出了問題：'+e.message,'<br><a class="btn primary" href="#/">回首頁</a>')+'</div>';}
}
window.addEventListener('hashchange',route);
window.__lunch={parseMenu:parseMenu,menuOf:menuOf,legacyMenuText:legacyMenuText,demo23Text:demo23Text,DEMO_MENU:DEMO_MENU,DEMO_TEA_TEXT:DEMO_TEA_TEXT};
ensureSeed();
route();
})();
</script>
